  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ewid=8aa453e4%2D2366%2D47f5%2D9098%2D0794ee21626f\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"align-self:flex-start; margin-top:16px; display:inline-flex; align-items:center; gap:6px; background:#18B7E8; color:#FFFFFF; font-size:12px; font-weight:700; text-decoration:none; padding:9px 18px; border-radius:9999px;\" style-hover=\"background:#149BC9; box-shadow:0 6px 18px rgba(24,183,232,0.35);\">Abrir biblioteca →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ═══ FOOTER ═══ -->\n    <footer data-screen-label=\"Footer\" style=\"margin-top:96px; border-top:1px solid var(--line); padding-top:36px;\">\n      <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:40px; flex-wrap:wrap;\">\n        <div style=\"display:flex; align-items:center; gap:12px;\">\n          <img src=\"ed9725ee-fe51-45ab-8cf5-a21a00fc6557\" alt=\"H&amp;A\" style=\"width:30px; height:30px; border-radius:50%; object-fit:contain;\">\n          <div>\n            <div style=\"font-size:12.5px; font-weight:700; color:var(--ink);\">Hidalgo <span style=\"font-weight:300; color:var(--text-3);\">&amp;<\u002Fspan> Asociados<\u002Fdiv>\n            <div style=\"font-size:10.5px; color:var(--text-3); margin-top:1px;\">{{ footerMeta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n          <a href=\"https://bhidalgo.monday.com/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:9999px; padding:8px 16px 8px 10px; text-decoration:none; color:inherit;\" style-hover=\"border-color:var(--celeste-border); box-shadow:var(--sh-sm); transform:translateY(-2px);\">\n            <span style=\"width:24px; height:24px; border-radius:7px; background:#6161FF; display:grid; place-items:center;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 40 40\" fill=\"none\"><circle cx=\"8\" cy=\"28\" r=\"7\" fill=\"#FF3D57\"><\u002Fcircle><circle cx=\"20\" cy=\"28\" r=\"7\" fill=\"#FFCA00\"><\u002Fcircle><circle cx=\"32\" cy=\"28\" r=\"7\" fill=\"#00D748\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n            <span style=\"font-size:12px; font-weight:600; color:var(--text-1);\">monday.com<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://www.afip.gob.ar\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:9999px; padding:8px 16px 8px 10px; text-decoration:none; color:inherit;\" style-hover=\"border-color:var(--celeste-border); box-shadow:var(--sh-sm); transform:translateY(-2px);\">\n            <span style=\"width:24px; height:24px; border-radius:7px; background:#003A8C; display:grid; place-items:center;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 40 40\" fill=\"none\"><rect x=\"4\" y=\"34\" width=\"32\" height=\"3\" rx=\"1\" fill=\"white\"><\u002Frect><rect x=\"4\" y=\"10\" width=\"32\" height=\"3\" rx=\"1\" fill=\"white\"><\u002Frect><polygon points=\"20,3 36,10 4,10\" fill=\"white\"><\u002Fpolygon><rect x=\"8\" y=\"13\" width=\"3\" height=\"21\" rx=\"1\" fill=\"white\"><\u002Frect><rect x=\"14\" y=\"13\" width=\"3\" height=\"21\" rx=\"1\" fill=\"white\"><\u002Frect><rect x=\"20\" y=\"13\" width=\"3\" height=\"21\" rx=\"1\" fill=\"white\"><\u002Frect><rect x=\"26\" y=\"13\" width=\"3\" height=\"21\" rx=\"1\" fill=\"white\"><\u002Frect><\u002Fsvg><\u002Fspan>\n            <span style=\"font-size:12px; font-weight:600; color:var(--text-1);\">ARCA<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://www.anses.gob.ar\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:9999px; padding:8px 16px 8px 10px; text-decoration:none; color:inherit;\" style-hover=\"border-color:var(--celeste-border); box-shadow:var(--sh-sm); transform:translateY(-2px);\">\n            <span style=\"width:24px; height:24px; border-radius:7px; background:#00843D; display:grid; place-items:center;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 40 40\" fill=\"none\"><circle cx=\"20\" cy=\"10\" r=\"5\" fill=\"white\"><\u002Fcircle><path d=\"M10 38 Q10 24 20 24 Q30 24 30 38\" fill=\"white\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span style=\"font-size:12px; font-weight:600; color:var(--text-1);\">ANSES<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://serviciosweb.afip.gob.ar/consultapadrondgisi/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:9999px; padding:8px 16px 8px 10px; text-decoration:none; color:inherit;\" style-hover=\"border-color:var(--celeste-border); box-shadow:var(--sh-sm); transform:translateY(-2px);\">\n            <span style=\"width:24px; height:24px; border-radius:7px; background:#1A6B3C; display:grid; place-items:center;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 40 40\" fill=\"none\"><rect x=\"6\" y=\"8\" width=\"28\" height=\"24\" rx=\"3\" fill=\"none\" stroke=\"white\" stroke-width=\"3\"><\u002Frect><rect x=\"12\" y=\"16\" width=\"16\" height=\"2\" rx=\"1\" fill=\"white\"><\u002Frect><rect x=\"12\" y=\"21\" width=\"10\" height=\"2\" rx=\"1\" fill=\"white\"><\u002Frect><\u002Fsvg><\u002Fspan>\n            <span style=\"font-size:12px; font-weight:600; color:var(--text-1);\">Padrón DGISI<\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:28px 0 0; font-size:10.5px; color:var(--text-3);\">Los datos de este portal (apps, versiones, cumpleaños, frases) se sincronizan automáticamente desde el repositorio. Impulsando espacios de transformación en Recursos Humanos.<\u002Fp>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n  <!-- ═══ COMMAND PALETTE ═══ -->\n  <sc-if value=\"{{ paletteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closePalette }}\" style=\"position:fixed; inset:0; background:rgba(15,33,51,0.50); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); z-index:100;\">\n      <div onclick=\"{{ stopProp }}\" style=\"max-width:580px; margin:12vh auto 0; background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--sh-lg); overflow:hidden;\">\n        <div style=\"display:flex; align-items:center; gap:13px; padding:18px 22px; border-bottom:1px solid var(--line-soft);\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"color:var(--celeste); flex-shrink:0;\"><circle cx=\"7\" cy=\"7\" r=\"5\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M11 11 L14.5 14.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <input ref=\"{{ paletteInputRef }}\" value=\"{{ query }}\" onchange=\"{{ onQuery }}\" placeholder=\"Buscar apps y links…\" style=\"flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:16px; color:var(--text-1);\">\n          <span style=\"font-size:10px; font-weight:700; background:var(--bg-soft); border:1px solid var(--line); border-radius:5px; padding:2px 7px; color:var(--text-3);\">ESC<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"max-height:340px; overflow-y:auto; padding:8px;\">\n          <sc-if value=\"{{ paletteEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:13px; color:var(--text-3); text-align:center; padding:24px 0;\">Sin resultados para esa búsqueda.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ paletteRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <a href=\"{{ r.url }}\" target=\"_blank\" rel=\"noopener\" onclick=\"{{ r.clickClose }}\" onmouseenter=\"{{ r.hoverSelect }}\" style=\"{{ r.style }}\">\n              <span style=\"width:34px; height:34px; flex-shrink:0; border-radius:10px; background:var(--celeste-dim); display:grid; place-items:center; font-size:15px;\">{{ r.icono }}<\u002Fspan>\n              <span style=\"flex:1; min-width:0;\">\n                <span style=\"display:block; font-size:13.5px; font-weight:600; color:var(--text-1);\">{{ r.nombre }}<\u002Fspan>\n                <span style=\"display:block; font-size:11px; color:var(--text-3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ r.sub }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-3); flex-shrink:0;\">{{ r.tipo }}<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:10px 22px; border-top:1px solid var(--line-soft); font-size:10.5px; color:var(--text-3); display:flex; gap:16px;\">\n          <span>↑↓ navegar<\u002Fspan><span>Enter abrir<\u002Fspan><span>Esc cerrar<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══ TOAST CUMPLEAÑOS ═══ -->\n  <sc-if value=\"{{ toastVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg, #F59E0B, #FBBF24); color:white; padding:14px 26px; border-radius:9999px; box-shadow:0 8px 32px rgba(245,158,11,0.40); display:flex; align-items:center; gap:12px; font-size:14px; font-weight:600; z-index:150;\">\n      <span>🎉<\u002Fspan>\n      <span>{{ toastMsg }}<\u002Fspan>\n      <span onclick=\"{{ closeToast }}\" style=\"cursor:pointer; opacity:0.75; font-size:15px; margin-left:6px;\">✕<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <canvas ref=\"{{ confettiRef }}\" style=\"position:fixed; inset:0; pointer-events:none; z-index:200;\"><\u002Fcanvas>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    theme: 'light',\n    name: '',\n    editingName: false,\n    tempName: '',\n    apps: [],\n    appsMeta: { version: '', ultimaActualizacion: '' },\n    bdays: [],\n    frases: [],\n    quoteIdx: 0,\n    news: null,            // null = loading, [] = failed\n    musicType: 'youtube',\n    faqOpen: {},\n    paletteOpen: false,\n    query: '',\n    selIdx: 0,\n    commitDates: {},\n    toastVisible: false,\n    toastMsg: '',\n    now: new Date(),\n  };\n\n  REPO = 'willyesposito/payroll-portal-ha';\n  BASE = 'https://willyesposito.github.io/payroll-portal-ha/';\n\n  FAQS = [\n    { icono: '🔒', pregunta: '¿Qué información NO puedo cargar en una IA?',\n      respuesta: 'Nunca ingresés en herramientas de IA datos personales de empleados ni de clientes: CUIL, DNI, nombre y apellido, remuneraciones, domicilio, datos de salud o legajos. La Ley 25.326 clasifica estos datos como sensibles y su tratamiento sin consentimiento puede generar sanciones. Las IAs públicas pueden almacenar los datos ingresados para mejorar sus modelos.' },\n    { icono: '⚠️', pregunta: '¿Qué pasa si subo datos de un empleado a una IA por error?',\n      respuesta: 'Informalo inmediatamente a tu responsable o al área de IT. Según la Ley 25.326 y la Disposición AAIP 4/2019, el estudio tiene obligación de notificar incidentes que afecten datos personales. Si la plataforma lo permite, eliminá el historial de la conversación de inmediato.' },\n    { icono: '🛡️', pregunta: '¿Qué sí puedo hacer con las IAs del trabajo?',\n      respuesta: 'Podés usarlas para: redactar textos genéricos, resumir normativa, generar plantillas, buscar errores en código propio, consultas conceptuales sobre liquidación o ARCA, y tareas que no involucren datos identificatorios de personas reales. La guía \"Cómo usar Claude\" del portal detalla los casos de uso aprobados.' },\n  ];\n\n  EXT_LINKS = [\n    { nombre: 'monday.com', sub: 'bhidalgo.monday.com', url: 'https://bhidalgo.monday.com/', icono: '🟪' },\n    { nombre: 'ARCA (ex-AFIP)', sub: 'afip.gob.ar', url: 'https://www.afip.gob.ar', icono: '🏛' },\n    { nombre: 'ANSES', sub: 'anses.gob.ar', url: 'https://www.anses.gob.ar', icono: '🧾' },\n    { nombre: 'Padrón DGISI', sub: 'Consulta de contribuyentes', url: 'https://serviciosweb.afip.gob.ar/consultapadrondgisi/', icono: '🗂' },\n  ];\n\n  MUSIC = {\n    youtube: { src: 'https://www.youtube.com/embed/videoseries?list=PL5Ls9dYg2bl53ycdhb7U7M7Q2-xGuPp3q&autoplay=0', h: 200 },\n    spotify: { src: 'https://open.spotify.com/embed/playlist/37i9dQZF1DX8NTLI2TtZa6', h: 152 },\n  };\n\n  confettiRef = React.createRef();\n\n  componentDidMount() {\n    try {\n      const t = localStorage.getItem('hyaPortalTheme');\n      const n = localStorage.getItem('hyaPortalName');\n      this.setState({ theme: t || 'light', name: n || '' }, () => this.applyTheme());\n    } catch (e) { this.applyTheme(); }\n    this.keyHandler = (e) => this.onGlobalKey(e);\n    window.addEventListener('keydown', this.keyHandler);\n    this.clock = setInterval(() => this.setState({ now: new Date() }), 60000);\n    this.loadData();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this.keyHandler);\n    clearInterval(this.clock);\n  }\n\n  applyTheme() {\n    document.documentElement.setAttribute('data-theme', this.state.theme);\n  }\n\n  /* ── DATA ─────────────────────────────── */\n  async loadData() {\n    const ts = Date.now();\n    const get = async (file) => {\n      try {\n        const r = await fetch(this.BASE + file + '?_t=' + ts);\n        if (!r.ok) throw new Error('http ' + r.status);\n        return await r.json();\n      } catch (e) {\n        try { const r2 = await fetch('./' + file); return await r2.json(); } catch (e2) { return null; }\n      }\n    };\n    const [appsData, cumple, frases] = await Promise.all([\n      get('apps.json'), get('cumpleanios.json'), get('frases.json'),\n    ]);\n    const next = {};\n    if (appsData && appsData.apps) {\n      next.apps = appsData.apps.filter(a => a.estado !== 'inactivo');\n      next.appsMeta = appsData.meta || this.state.appsMeta;\n    }\n    if (Array.isArray(cumple)) next.bdays = cumple;\n    if (Array.isArray(frases) && frases.length) {\n      next.frases = frases;\n      next.quoteIdx = Math.floor(Math.random() * frases.length);\n    }\n    this.setState(next, () => {\n      this.checkTodayBirthdays();\n      if (this.state.apps.length) this.fetchCommitDates(this.state.apps);\n    });\n    this.fetchNews();\n  }\n\n  async fetchCommitDates(apps) {\n    let cache = null;\n    try { cache = JSON.parse(localStorage.getItem('hyaPortalCommits') || 'null'); } catch (e) {}\n    if (cache && cache.ts && (Date.now() - cache.ts < 6 * 3600 * 1000)) {\n      this.setState({ commitDates: cache.data || {} });\n      return;\n    }\n    const data = {};\n    const files = apps.map(a => (a.url || '').split('/').pop()).filter(Boolean);\n    files.push('apps.json');\n    await Promise.all(files.map(async (file) => {\n      try {\n        const r = await fetch('https://api.github.com/repos/' + this.REPO + '/commits?path=' + encodeURIComponent(file) + '&per_page=1');\n        if (!r.ok) return;\n        const j = await r.json();\n        if (j && j[0] && j[0].commit) data[file] = j[0].commit.committer.date;\n      } catch (e) {}\n    }));\n    if (Object.keys(data).length) {\n      this.setState({ commitDates: data });\n      try { localStorage.setItem('hyaPortalCommits', JSON.stringify({ ts: Date.now(), data })); } catch (e) {}\n    }\n  }\n\n  async fetchNews() {\n    const feeds = [\n      { url: 'https://www.iprofesional.com/rss/impuestos.xml', fuente: 'iProfesional' },\n      { url: 'https://www.ambito.com/rss/economia.xml', fuente: 'Ámbito' },\n    ];\n    try {\n      const proxy = 'https://api.rss2json.com/v1/api.json?count=3&rss_url=';\n      const results = await Promise.allSettled(feeds.map(f =>\n        fetch(proxy + encodeURIComponent(f.url)).then(r => r.json()).then(d => ({ d, fuente: f.fuente }))\n      ));\n      const items = results\n        .filter(r => r.status === 'fulfilled' && r.value.d && r.value.d.status === 'ok')\n        .flatMap(r => r.value.d.items.slice(0, 3).map(i => ({\n          fuente: r.value.fuente, titulo: i.title, hace: this.timeAgo(i.pubDate), url: i.link,\n        })));\n      this.setState({ news: items.slice(0, 5) });\n    } catch (e) {\n      this.setState({ news: [] });\n    }\n  }\n\n  timeAgo(ds) {\n    const m = Math.floor((Date.now() - new Date(ds)) / 60000);\n    if (m < 60) return 'Hace ' + m + ' min';\n    if (m < 1440) return 'Hace ' + Math.floor(m / 60) + ' h';\n    if (m < 2880) return 'Ayer';\n    return 'Hace ' + Math.floor(m / 1440) + ' días';\n  }\n\n  relDate(iso) {\n    if (!iso) return '';\n    const d = Math.floor((Date.now() - new Date(iso)) / 86400000);\n    if (d <= 0) return 'hoy';\n    if (d === 1) return 'ayer';\n    if (d < 30) return 'hace ' + d + ' días';\n    const dt = new Date(iso);\n    const lm = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n    return dt.getDate() + ' ' + lm[dt.getMonth()] + ' ' + dt.getFullYear();\n  }\n\n  /* ── BIRTHDAYS ────────────────────────── */\n  checkTodayBirthdays() {\n    const now = new Date();\n    const todayStr = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');\n    const today = this.state.bdays.filter(b => b.fecha === todayStr);\n    if (today.length) {\n      const names = today.map(b => b.nombre.split(' ')[0]).join(' y ');\n      setTimeout(() => {\n        this.setState({ toastVisible: true, toastMsg: '¡Feliz cumpleaños, ' + names + '! 🎂' });\n        this.launchConfetti();\n      }, 900);\n    }\n  }\n\n  launchConfetti() {\n    const canvas = this.confettiRef.current;\n    if (!canvas) return;\n    canvas.width = window.innerWidth;\n    canvas.height = window.innerHeight;\n    const ctx = canvas.getContext('2d');\n    const colors = ['#00ACD4', '#1E3A5F', '#F59E0B', '#22C55E', '#7B2FBE', '#E85518', '#ffffff'];\n    const pieces = Array.from({ length: 160 }, () => ({\n      x: Math.random() * canvas.width, y: Math.random() * -canvas.height,\n      w: Math.random() * 10 + 4, h: Math.random() * 5 + 3,\n      color: colors[Math.floor(Math.random() * colors.length)],\n      rot: Math.random() * Math.PI * 2, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 3 + 2,\n      vr: (Math.random() - 0.5) * 0.15, alpha: 1,\n    }));\n    let frame = 0;\n    const total = 220;\n    const draw = () => {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      frame++;\n      pieces.forEach(p => {\n        p.x += p.vx; p.y += p.vy; p.rot += p.vr;\n        if (frame > total * 0.6) p.alpha = Math.max(0, p.alpha - 0.015);\n        ctx.save(); ctx.globalAlpha = p.alpha; ctx.translate(p.x, p.y); ctx.rotate(p.rot);\n        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();\n      });\n      if (frame < total) requestAnimationFrame(draw);\n      else ctx.clearRect(0, 0, canvas.width, canvas.height);\n    };\n    draw();\n  }\n\n  /* ── PALETTE ──────────────────────────── */\n  getSearchable() {\n    const apps = this.state.apps.map(a => ({\n      nombre: a.nombre, sub: a.descripcion || '', url: a.url, icono: a.icono || '·', tipo: 'App',\n    }));\n    return apps.concat(this.EXT_LINKS.map(l => ({ ...l, tipo: 'Externo' })));\n  }\n\n  getResults() {\n    const q = this.state.query.trim().toLowerCase();\n    const all = this.getSearchable();\n    if (!q) return all;\n    return all.filter(r => (r.nombre + ' ' + r.sub).toLowerCase().includes(q));\n  }\n\n  onGlobalKey(e) {\n    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {\n      e.preventDefault();\n      this.setState(s => ({ paletteOpen: !s.paletteOpen, query: '', selIdx: 0 }));\n      return;\n    }\n    if (!this.state.paletteOpen) return;\n    if (e.key === 'Escape') {\n      this.setState({ paletteOpen: false });\n    } else if (e.key === 'ArrowDown') {\n      e.preventDefault();\n      const max = this.getResults().length - 1;\n      this.setState(s => ({ selIdx: Math.min(s.selIdx + 1, Math.max(max, 0)) }));\n    } else if (e.key === 'ArrowUp') {\n      e.preventDefault();\n      this.setState(s => ({ selIdx: Math.max(s.selIdx - 1, 0) }));\n    } else if (e.key === 'Enter') {\n      const r = this.getResults()[this.state.selIdx];\n      if (r) { window.open(r.url, '_blank'); this.setState({ paletteOpen: false }); }\n    }\n  }\n\n  /* ── DATE HELPERS ─────────────────────── */\n  getFourthBizDay(y, m) {\n    let c = 0, d = 1;\n    while (true) {\n      const dt = new Date(y, m, d);\n      const dow = dt.getDay();\n      if (dow !== 0 && dow !== 6) { c++; if (c === 4) return dt; }\n      d++;\n    }\n  }\n\n  /* ── RENDER VALS ──────────────────────── */\n  renderVals() {\n    const s = this.state;\n    const now = s.now;\n    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];\n    const mesesC = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];\n    const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];\n    const lm = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n\n    /* greeting */\n    const h = now.getHours();\n    const greetingPrefix = (h < 12 ? 'Buen día, ' : h < 19 ? 'Buenas tardes, ' : 'Buenas noches, ');\n    const displayName = s.name || 'equipo Payroll';\n    const initials = s.name\n      ? s.name.trim().split(/\\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase()\n      : 'PY';\n\n    /* date line */\n    const todayLong = dias[now.getDay()] + ' ' + now.getDate() + ' de ' + meses[now.getMonth()];\n    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());\n    let cierre = new Date(now.getFullYear(), now.getMonth(), 25);\n    if (cierre <= todayMid) cierre.setMonth(cierre.getMonth() + 1);\n    const dCierre = Math.max(0, Math.ceil((cierre - todayMid) / 86400000));\n    const cierreLabel = dCierre === 0 ? '¡hoy!' : 'en ' + dCierre + ' días (' + cierre.getDate() + ' ' + lm[cierre.getMonth()] + ')';\n    let pago = this.getFourthBizDay(now.getFullYear(), now.getMonth());\n    if (todayMid > pago) pago = this.getFourthBizDay(now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear(), now.getMonth() === 11 ? 0 : now.getMonth() + 1);\n    const dPago = Math.ceil((pago - todayMid) / 86400000);\n    const pagoLabel = dPago <= 0 ? '¡hoy!' : pago.getDate() + ' ' + lm[pago.getMonth()] + ' (en ' + dPago + ' días)';\n\n    /* apps */\n    const appRows = s.apps.map((a, i) => {\n      const file = (a.url || '').split('/').pop();\n      const commit = s.commitDates[file];\n      const beta = a.estado === 'beta';\n      const upd = commit ? ' · actualizado ' + this.relDate(commit) : '';\n      return {\n        ...a,\n        idx: String(i + 1).padStart(2, '0'),\n        icono: a.icono || '·',\n        tag: beta ? 'Beta' : (a.categoria || 'App'),\n        tagStyle: {\n          background: beta ? 'var(--amber-dim)' : 'var(--celeste-dim)',\n          color: beta ? 'var(--amber)' : 'var(--celeste)',\n          borderRadius: '9999px', padding: '3px 11px',\n          fontSize: '10px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em',\n        },\n        metaLine: 'v' + (a.version || '1.0') + upd,\n      };\n    });\n    const appsCountLabel = s.apps.length ? s.apps.length + ' herramientas' : '';\n\n    /* faq */\n    const faqRows = this.FAQS.map((f, i) => {\n      const open = !!s.faqOpen[i];\n      return {\n        ...f,\n        toggle: () => this.setState(st => ({ faqOpen: { ...st.faqOpen, [i]: !st.faqOpen[i] } })),\n        chevStyle: {\n          width: '24px', height: '24px', borderRadius: '50%', flexShrink: 0,\n          background: open ? 'var(--celeste)' : 'var(--celeste-dim)',\n          color: open ? '#fff' : 'var(--celeste)',\n          display: 'grid', placeItems: 'center', fontSize: '12px',\n          transform: open ? 'rotate(180deg)' : 'rotate(0deg)',\n        },\n        ansStyle: {\n          maxHeight: open ? 'none' : '0px',\n          overflow: 'hidden',\n        },\n      };\n    });\n\n    /* birthdays — current month */\n    const monthStr = String(now.getMonth() + 1).padStart(2, '0');\n    const todayStr = monthStr + '-' + String(now.getDate()).padStart(2, '0');\n    const AV = ['#00ACD4', '#1E3A5F', '#5CB85C', '#7B2FBE', '#F59E0B', '#0090B4', '#2A4F7A'];\n    const brandColor = (str) => {\n      let hh = 0;\n      for (let i = 0; i < str.length; i++) hh = ((hh << 5) - hh) + str.charCodeAt(i);\n      return AV[Math.abs(hh) % AV.length];\n    };\n    const thisMonth = s.bdays\n      .filter(b => b.fecha && b.fecha.startsWith(monthStr))\n      .sort((a, b) => a.fecha.localeCompare(b.fecha));\n    const bdayRows = thisMonth.map(b => {\n      const isToday = b.fecha === todayStr;\n      const [, dd] = b.fecha.split('-');\n      return {\n        ...b,\n        isToday,\n        meta: (b.area || '') + ' · ' + (isToday ? '¡Hoy!' : parseInt(dd, 10) + ' de ' + meses[now.getMonth()]),\n        avStyle: {\n          width: '38px', height: '38px', borderRadius: '50%', flexShrink: 0,\n          background: brandColor(b.nombre || '?'),\n          color: '#fff', display: 'grid', placeItems: 'center',\n          fontSize: '12px', fontWeight: 700,\n        },\n      };\n    });\n    const bdayEmpty = s.bdays.length > 0 && thisMonth.length === 0;\n    const bdayCountLabel = thisMonth.length ? thisMonth.length + ' en ' + meses[now.getMonth()] : '';\n\n    /* quote */\n    const q = s.frases.length ? s.frases[s.quoteIdx % s.frases.length] : null;\n    const quoteText = q ? q.texto : 'Cargando frase del día…';\n    const quoteAuthor = q ? '— ' + q.autor : '';\n\n    /* news */\n    const newsLoading = s.news === null;\n    const newsFailed = Array.isArray(s.news) && s.news.length === 0;\n    const newsRows = Array.isArray(s.news) ? s.news : [];\n\n    /* music */\n    const music = this.MUSIC[s.musicType];\n    const segBtn = (active) => ({\n      fontFamily: 'inherit', fontSize: '10.5px', fontWeight: 600,\n      padding: '5px 13px', borderRadius: '9999px', cursor: 'pointer',\n      border: active ? '1px solid var(--celeste)' : '1px solid var(--line)',\n      background: active ? 'var(--celeste)' : 'transparent',\n      color: active ? '#fff' : 'var(--text-3)',\n    });\n\n    /* palette */\n    const results = this.getResults();\n    const paletteRows = results.map((r, i) => ({\n      ...r,\n      clickClose: () => this.setState({ paletteOpen: false }),\n      hoverSelect: () => this.setState({ selIdx: i }),\n      style: {\n        display: 'flex', alignItems: 'center', gap: '13px',\n        padding: '11px 14px', borderRadius: '12px',\n        textDecoration: 'none', color: 'inherit',\n        background: i === s.selIdx ? 'var(--celeste-dim)' : 'transparent',\n      },\n    }));\n\n    /* footer */\n    const appsJsonCommit = s.commitDates['apps.json'];\n    const metaDate = appsJsonCommit ? this.relDate(appsJsonCommit) : (s.appsMeta.ultimaActualizacion || '');\n    const footerMeta = 'Catálogo v' + (s.appsMeta.version || '—') + (metaDate ? ' · actualizado ' + metaDate : '') + ' · sincronización automática';\n\n    return {\n      /* topbar */\n      themeGlyph: s.theme === 'dark' ? '☀' : '☾',\n      toggleTheme: () => this.setState(st => ({ theme: st.theme === 'dark' ? 'light' : 'dark' }), () => {\n        this.applyTheme();\n        try { localStorage.setItem('hyaPortalTheme', this.state.theme); } catch (e) {}\n      }),\n      initials, displayName,\n      openPalette: () => this.setState({ paletteOpen: true, query: '', selIdx: 0 }),\n\n      /* masthead */\n      greetingPrefix,\n      editingName: s.editingName,\n      tempName: s.tempName,\n      startEditName: () => this.setState({ editingName: true, tempName: s.name }),\n      onTempName: (e) => this.setState({ tempName: e.target.value }),\n      onTempKey: (e) => { if (e.key === 'Enter') this.saveNameNow(); if (e.key === 'Escape') this.setState({ editingName: false }); },\n      saveName: () => this.saveNameNow(),\n      nameInputRef: (el) => { if (el) el.focus(); },\n      todayLong, cierreLabel, pagoLabel,\n      heroDay: String(now.getDate()).padStart(2, '0'),\n      heroMonthYear: mesesC[now.getMonth()] + ' ' + now.getFullYear(),\n      heroWday: dias[now.getDay()].toUpperCase(),\n\n      /* apps */\n      appRows, appsCountLabel,\n\n      /* faq + bdays */\n      faqRows, bdayRows, bdayEmpty, bdayCountLabel,\n\n      /* equipo */\n      quoteText, quoteAuthor,\n      nextQuote: () => this.setState(st => ({ quoteIdx: (st.quoteIdx + 1) % Math.max(st.frases.length, 1) })),\n      musicSrc: music.src, musicH: music.h,\n      ytBtnStyle: segBtn(s.musicType === 'youtube'),\n      spBtnStyle: segBtn(s.musicType === 'spotify'),\n      setYoutube: () => this.setState({ musicType: 'youtube' }),\n      setSpotify: () => this.setState({ musicType: 'spotify' }),\n      newsLoading, newsFailed, newsRows,\n\n      /* palette */\n      paletteOpen: s.paletteOpen,\n      query: s.query,\n      onQuery: (e) => this.setState({ query: e.target.value, selIdx: 0 }),\n      paletteInputRef: (el) => { if (el) el.focus(); },\n      paletteRows,\n      paletteEmpty: results.length === 0,\n      closePalette: () => this.setState({ paletteOpen: false }),\n      stopProp: (e) => e.stopPropagation(),\n\n      /* toast */\n      toastVisible: s.toastVisible,\n      toastMsg: s.toastMsg,\n      closeToast: () => this.setState({ toastVisible: false }),\n\n      /* footer */\n      footerMeta,\n      confettiRef: this.confettiRef,\n    };\n  }\n\n  saveNameNow() {\n    const name = this.state.tempName.trim();\n    this.setState({ name, editingName: false });\n    try { localStorage.setItem('hyaPortalName', name); } catch (e) {}\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

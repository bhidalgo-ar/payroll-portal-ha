<style>
  /* H&A Brand · Tema oscuro (default) */

    --bg-base:#0f172a;
    --bg-card:#1e293b;
    --bg-input:#0f172a;
    --bg-select:#334155;
    --bg-header:#1E3A5F;
    --border:#334155;
    --border-strong:#475569;
    --text:#e2e8f0;
    --text-bright:#ffffff;
    --text-muted:#94a3b8;
    --text-dim:#64748b;
    --brand-primary:#18B7E8;
    --brand-secondary:#1E3A5F;
    --brand-on-primary:#ffffff;
    --accent-warning:#fbbf24;
    --accent-error:#f87171;

    --accent-mutual:#8C837B;

  /* H&A Brand · Tema claro (editorial: base blanca, navy texto, celeste acento) */
  [data-theme="light"]{
    --bg-base:#f8fafc;
    --bg-card:#ffffff;
    --bg-input:#f1f5f9;
    --bg-select:#e2e8f0;
    --bg-header:#ffffff;
    --border:#cbd5e1;
    --border-strong:#94a3b8;
    --text:#1E3A5F;
    --text-bright:#0f172a;
    --text-muted:#475569;
    --text-dim:#64748b;
    --brand-primary:#18B7E8;
    --brand-secondary:#1E3A5F;
    --brand-on-primary:#ffffff;
    --accent-warning:#b45309;
    --accent-error:#b91c1c;
    --accent-info:#1d4ed8;
    --accent-mutual:#5C544E;
    --row-alt:rgba(241,245,249,.7);

  body{margin:0;background:var(--bg-base);color:var(--text);font-family:'Source Sans Pro',Arial,Helvetica,sans-serif;transition:background .2s ease,color .2s ease}

  .vendor-chip{display:inline-flex;align-items:center;justify-content:center;background:#fff;padding:4px 8px;border-radius:6px;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s}

<body>
<div id="root"></div>
<script type="text/babel">
/* ═══════════════════════════════════════════
   SECCIÓN: CONSTANTS
   Variables globales, sistemas, clientes default
   ═══════════════════════════════════════════ */
const {useState,useEffect,useRef,useMemo,useCallback} = React;

/* ─── Constants ─── */
const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const YEARS=[2024,2025,2026,2027,2028];
const HISTORY_MAX=100;

/* Sistema del cliente — 2 opciones únicamente */
const SYSTEMS={
  axton:{label:"Axton IT",   badge:"AX",  bg:"#0f2a40",text:"#60a5fa",border:"#2563eb"},
  meta4:{label:"Meta 4",     badge:"M4",  bg:"#083344",text:"#18B7E8",border:"#0e7490"},
};

/* Formato de salida Meta 4 — se elige al procesar */
const META4_FORMATS={
  incidencias:{label:"Incidencias",   badge:"M4I",  bg:"#083344",text:"#18B7E8",border:"#0e7490"},
  fase_alta:  {label:"Fase de Alta",  badge:"M4FA", bg:"#1e3a5f",text:"#93c5fd",border:"#2563eb"},
};

/* Clientes pre-cargados */
const DEFAULT_CLIENTS=[
  "Allegro","Bonafide","Campari","Carrier","COELSA","Copetro","Coty","Credencial",
  "DLA","Epiroc","Finadiet","Geopagos","GSMA","Lowsedo","Marval","Merz",
  "PGI","Piano","Plasticomnium Florida","Plasticomnium Pilar","Poincenot",
  "Red Bull","SIASA","Sportline","TIM","Toyota","TPA"
].map((name,i)=>({
  id:"default_"+i, name,
  shortName:name.replace(/\s+/g,"").slice(0,8).toUpperCase(),
  system:"meta4", orgId:"", convenio:"", concepts:[], isDefault:true,
}));

/* ERP de origen */
const SOURCE_ERPS={
  axton:{label:"Axton IT",icon:"axton",desc:"Archivo exportado desde Axton IT"},
  meta4:{label:"Meta 4",  icon:"meta4",desc:"Archivo exportado desde Meta 4"},
  otro: {label:"Otro / Desconocido",icon:"otro",desc:"Excel genérico, detección automática"},
};
/* Render del ícono del ERP — usa logos reales para Axton/Meta4, emoji para "otro" */
function renderErpIcon(key){
  if(key==="axton")return(<span className="erp-icon-wrap"><img src="Axton_LOGO_ColorAzul-1-1536x293.png" alt="Axton IT" className="erp-icon"/></span>);
  if(key==="meta4")return(<span className="erp-icon-wrap"><img src="meta4_logo_orh.png" alt="Meta 4" className="erp-icon"/></span>);
  return(<span style={{fontSize:32,display:"inline-block",lineHeight:1}}>📄</span>);
}

/* Tipos de archivo de novedades — fuente única de verdad para claves, labels y colores.
   Paleta 100% alineada a brand H&A (skill v2.0): sin verde, sin naranja, sin lavanda.
   Celeste oficial #18B7E8, gris cálido #8C837B, negro y rojo semántico únicamente. */
/* Nota: "auto" = Fase de Alta (columnas); "mutual" = Incidencia por filas (Meta4/Mutual).
   No confundir "auto" con el antiguo "fase_alta" que existía en versiones anteriores del Gestor. */
const FILE_TYPES={
  auto:  {key:"auto",   label:"Fase de Alta (Auto)", badge:"AUTO",   groupLabel:"FASE DE ALTA", color:"#18B7E8",bg:"rgba(24,183,232,.14)"},
  mutual:{key:"mutual", label:"Incidencia (Mutual)", badge:"MUTUAL", groupLabel:"INCIDENCIA",   color:"#8C837B",bg:"rgba(140,131,123,.14)"},
  axton: {key:"axton",  label:"Axton",               badge:"AXTON",  groupLabel:"AXTON",        color:"#1E3A5F",bg:"rgba(30,58,95,.14)"},
  error:  {key:"error",  label:"Error",               badge:"ERROR",  groupLabel:"ERRORES",      color:"#dc2626",bg:"rgba(220,38,38,.14)"},
  loading:{key:"loading",label:"Cargando…",           badge:"···",    groupLabel:"CARGANDO",     color:"#8C837B",bg:"rgba(140,131,123,.14)"},
};

const ls=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

/* ─── Inferencia tipo_valor por nombre de concepto (Axton) ─── */
/* ═══════════════════════════════════════════
   SECCIÓN: HELPERS & PARSERS
   parseExcel, findHRow, ERP patterns, detectColumns,
   analyzeStructure, inferTipoValor, parseAxtonConceptFile,
   parseMeta4ConceptFile
   ═══════════════════════════════════════════ */
function inferTipoValor(nombre,manual){
  if(manual!==undefined)return manual;
  const n=(nombre||"").toLowerCase();
  if(/\b(hs\.?|horas?|d[ií]as?|jornada|ausencia|licencia|vacacion|inasist|unidad|cantidad|n[uú]mero|nro\.?\s*hora|seman)\b/i.test(n))
    return"cantidad";
  return"monto";
}

/* ─── Inferencia tipo_valor por unidad (Meta4) ─── */
function inferTipoValorMeta4(unidadNombre){
  const n=(unidadNombre||"").toLowerCase();
  if(/hora|d[ií]a|jornada|unidad|cantidad|n[uú]mero|nro\.|cuota/i.test(n))return"cantidad";
  return"monto";
}

/* ─── Parse conceptos Axton (ReporteConceptos.xlsx) ─── */
/* Header en fila 3 (idx 2): Numero, Concepto, Reducido, Tipo, Grupo, ... */
function parseAxtonConceptFile(data){
  // Buscar fila de header buscando "Numero" o "Concepto"
  let hr=2;
  for(let i=0;i<Math.min(6,data.length);i++){
    if(String(data[i]?.[0]||"").trim()==="Numero"){hr=i;break;}
  }
  const rows=data.slice(hr+1).filter(r=>r[0]&&!isNaN(String(r[0]).trim())&&String(r[0]).trim());
  return rows.map(r=>{
    const id=String(r[0]||"").trim();
    const nombre=String(r[1]||"").trim();
    const tipoAxton=String(r[3]||"").trim();  // De Carga, Liquidacion, etc.
    const grupo=String(r[4]||"").trim();       // Remunerativos, Patronales
    return{id,nombre,tipoAxton,grupo,tipoValor:inferTipoValor(nombre),tipoManual:false};
  }).filter(r=>r.id&&r.nombre);
}

/* ─── Parse conceptos Meta4 con mapeo flexible de columnas ─── */
function parseMeta4ConceptFile(data,colMap){
  const hr=findHRow(data);
  return data.slice(hr+1)
    .filter(r=>r[colMap.id]&&!isNaN(String(r[colMap.id]).trim())&&String(r[colMap.id]).trim())
    .map(r=>{
      const id=String(r[colMap.id]||"").trim();
      const nombre=String(r[colMap.nombre]||"").trim();
      const unidadNombre=colMap.unidad>=0?String(r[colMap.unidad]||"").trim():"";
      const tipoPreli=colMap.tipo>=0?String(r[colMap.tipo]||"").trim():"";
      return{id,nombre,nombreCorto:nombre,unidadId:"",unidadNombre,tipoPreli,
        tipoValor:unidadNombre?inferTipoValorMeta4(unidadNombre):inferTipoValor(nombre),
        tipoManual:false};
    })
    .filter(r=>r.id&&r.nombre);
}

function guessConceptCol(hdrLabels,hints){
  return hdrLabels.findIndex(h=>hints.some(k=>h.includes(k)));
}

/* ─── Helpers ─── */
function getActiveMap(cli,axtonMap,clientMap){return cli?.system==="axton"?axtonMap:clientMap;}
function parseExcel(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        const sheets={};
        wb.SheetNames.forEach(name=>{
          sheets[name]=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:""});
        });
        const ws0=wb.Sheets[wb.SheetNames[0]];
        const hadFilter=!!(ws0&&(ws0["!autofilter"]||(ws0["!rows"]&&ws0["!rows"].some(r=>r&&r.hidden))));
        res({sheets,sheetNames:wb.SheetNames,firstSheet:sheets[wb.SheetNames[0]],hadFilter,worksheets:wb.Sheets});
      }catch(err){rej(err)}
    };
    r.readAsArrayBuffer(file);
  });
}

/* ─── Multi-file helpers (porteados del Agrupador) ─── */
function toAK(row){
  const r=[...(row||[])];
  while(r.length<11)r.push(null);
  return r.slice(0,11);
}
function fmtDateDDMMYYYY(d){
  if(!d||!(d instanceof Date)||isNaN(d.getTime()))return "";
  const dd=String(d.getUTCDate()).padStart(2,"0");
  const mm=String(d.getUTCMonth()+1).padStart(2,"0");
  return `${dd}/${mm}/${d.getUTCFullYear()}`;
}
function normTxt(s){
  if(s===null||s===undefined)return "";
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
}
/* Normaliza strings de fecha a DD/MM/AAAA — soporta ISO, DD/MM/YYYY y variantes con guion */
function normDateStr(s){
  if(s===null||s===undefined)return"";
  const str=String(s).trim();
  if(!str||str==="—")return str;
  let m=str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return`${m[3].padStart(2,"0")}/${m[2].padStart(2,"0")}/${m[1]}`;
  m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];return`${m[1].padStart(2,"0")}/${m[2].padStart(2,"0")}/${y}`;}
  return str;
}
/* Parsea string de fecha a JS Date (asume formato día primero — castellano AR) */
function parseDateAR(s){
  if(s===null||s===undefined||s==="")return null;
  if(s instanceof Date)return isNaN(s.getTime())?null:s;
  const str=String(s).trim();
  if(!str)return null;
  /* ISO YYYY-MM-DD o YYYY/MM/DD */
  let m=str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  /* DD/MM/YYYY o DD-MM-YYYY (formato AR — día primero); detecta M/D/Y (US) si mes>12 */
  m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){const y=m[3].length===2?2000+(+m[3]):+m[3];let d=+m[1],mo=+m[2];if(mo>12&&d<=12){[d,mo]=[mo,d];}return new Date(Date.UTC(y,mo-1,d));}
  return null;
}
/* Parsea número en formato argentino ("1.003,00") o estándar ("1003.00") → number | null */
function parseArgNum(v){
  if(v===null||v===undefined||v==="")return null;
  if(typeof v==="number")return v;
  const s=String(v).trim().replace(/\s/g,"");
  if(!s)return null;
  if(/^-?\d{1,3}(\.\d{3})*(,\d{1,2})?$/.test(s))return parseFloat(s.replace(/\./g,"").replace(",","."));
  if(/^-?\d+(,\d{1,2})?$/.test(s)&&s.includes(","))return parseFloat(s.replace(",","."));
  if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);
  return null;
}
/* Detecta si un encabezado de columna corresponde a un campo numérico exportable */
function isNumericHeader(h){
  return/\b(cant|cantidad|monto|valor|importe|sueldo|salario|basico|horas?|dias?|unidad)\b/i.test(normTxt(h));
}
/* Detecta si un encabezado corresponde a un campo fecha */
function isDateHeader(h){
  const n=normTxt(h);
  return/fecha/.test(n)||/^fec[_\s]/.test(n);
}
function isLegajoLbl(s){return s.includes("legajo")||s.includes("leg.")||s==="leg"||s.startsWith("leg ");}
function isCodigoLbl(s){
  if(s.includes("codigo"))return true;
  if(s==="id")return true;
  if(s.startsWith("id ")||s.startsWith("id_"))return true;
  return false;
}
/* Detecta tipo por posición de Codigo vs Valor en A:K (regla del Agrupador).
   Devuelve 'auto' (Valor antes de Codigo), 'mutual' (Codigo antes), o null. */
function detectTypeByPosition(headers){
  const ak=toAK(headers||[]);
  const normH=ak.map(h=>normTxt(h));
  const codigoIdx=normH.findIndex(isCodigoLbl);
  const valorIdx =normH.findIndex(h=>h.includes("valor")||h==="monto"||h==="importe");
  if(codigoIdx<0||valorIdx<0)return null;
  if(codigoIdx===valorIdx)return null;
  return codigoIdx<valorIdx?FILE_TYPES.mutual.key:FILE_TYPES.auto.key;
}

/* Smart header row detection — escanea hasta 20 filas para archivos con cabeceras antes del encabezado */
function findHRow(data,maxScan=20){
  let best=0,bestScore=0;
  for(let i=0;i<Math.min(maxScan,data.length);i++){
    const row=data[i]||[];
    const filled=row.filter(c=>c&&String(c).trim()).length;
    const hasText=row.filter(c=>c&&isNaN(c)&&String(c).trim().length>1).length;
    const score=filled*2+hasText*3;
    if(score>bestScore){bestScore=score;best=i}
  }
  return best;
}

/* ERP-specific column detection patterns */
const ERP_PATTERNS={
  axton:{
    legajo:[/^legajo$/i,/^leg\.?$/i,/^nro\.?\s*leg/i,/^numero\s*legajo/i],
    nombre:[/apellido.*nombre/i,/nombre.*apellido/i,/^nombre$/i,/^apellido$/i,/^empleado$/i],
    cuil:[/^cuil$/i,/^cuit$/i],
    concepto_code:[/^\d{3,5}$/],
    fecha_ingreso:[/fecha.*ingreso/i,/ingreso/i,/alta/i],
    sueldo:[/sueldo/i,/basico/i,/básico/i,/remunerac/i],
    uo:[/u\.?o\.?\s/i,/unidad\s*org/i,/convenio/i,/categ/i],
  },
  meta4:{
    legajo:[/^legajo$/i,/^leg\.?$/i,/^nro\.?\s*leg/i,/^codigo\s*empl/i,/^empleado$/i],
    nombre:[/apellido.*nombre/i,/nombre.*apellido/i,/^nombre$/i,/^apellido$/i],
    concepto:[/concepto/i,/^codigo$/i,/^cod\.?\s*concepto/i],
    valor:[/valor/i,/monto/i,/importe/i,/cantidad/i],
    fecha:[/fecha/i,/periodo/i,/imputac/i],
  },
  otro:{
    legajo:[/legajo/i,/leg\.?\b/i,/employee.*id/i,/nro/i,/numero/i],
    nombre:[/nombre/i,/apellido/i,/employee/i,/trabajador/i],
  }
};

function detectColumns(headers,erpType){
  const patterns=ERP_PATTERNS[erpType]||ERP_PATTERNS.otro;
  const detected={};
  Object.entries(patterns).forEach(([field,regexes])=>{
    for(let i=0;i<headers.length;i++){
      const label=headers[i].label;
      if(regexes.some(rx=>rx.test(label))){
        if(!detected[field])detected[field]={idx:i,label};
      }
    }
  });
  return detected;
}

/* Analyze file structure for ERP hints */
function analyzeStructure(data,erpHint){
  const info={detectedErp:erpHint,confidence:"high",notes:[],headerRow:0,dataStartRow:1,columnCount:0,rowCount:0};
  if(!data||!data.length)return info;

  info.headerRow=findHRow(data);
  info.dataStartRow=info.headerRow+1;
  const hdrs=(data[info.headerRow]||[]).map((c,i)=>({label:String(c||`Col ${i+1}`).trim(),idx:i}));
  info.columnCount=hdrs.length;
  const dataRows=data.slice(info.dataStartRow).filter(r=>r.some(c=>c&&String(c).trim()));
  info.rowCount=dataRows.length;

  /* If "otro", try to guess ERP from content clues */
  if(erpHint==="otro"){
    const allText=data.slice(0,5).flat().join(" ").toLowerCase();
    if(/axton|u\.?o\.?\s*cliente|lnodnro/i.test(allText)){
      info.detectedErp="axton";info.confidence="medium";info.notes.push("Detectado como posible Axton por contenido");
    }else if(/meta\s*4|concepto.*valor|imputaci/i.test(allText)){
      info.detectedErp="meta4";info.confidence="medium";info.notes.push("Detectado como posible Meta 4 por contenido");
    }else{
      info.confidence="low";info.notes.push("No se detectó ERP específico, usando detección genérica");
    }
  }

  /* Check for Axton F2 specific structure */
  if(erpHint==="axton"||info.detectedErp==="axton"){
    const row0=data[0]||[];
    const row1=data[1]||[];
    if(String(row0[0]||"").toLowerCase().includes("unidad organizativa")){
      info.notes.push("Formato Axton F2 detectado (Unidad Organizativa en fila 1)");
      info.headerRow=1;info.dataStartRow=2;
    }
    if(String(row1[0]||"").trim()==="Legajo"){
      info.notes.push("Header Axton estándar en fila 2");
      info.headerRow=1;info.dataStartRow=2;
    }
  }

  /* Check for Meta4 specific structure */
  if(erpHint==="meta4"||info.detectedErp==="meta4"){
    const row0text=(data[0]||[]).join(" ").toLowerCase();
    if(row0text.includes("formato 2")){
      info.notes.push("Formato Meta 4 F2 detectado");
      info.headerRow=1;info.dataStartRow=2;
    }
  }

  return info;
}

      const sheetName=preferidas.find(n=>sheetNames.map(s=>s.toLowerCase()).includes(n.toLowerCase()))||sheetNames[0];
      const data=sheets[sheetName];
      if(!data||data.length<2){alert("No se encontraron datos en el archivo.");return;}
      const hr=findHRow(data);
      const hdrs=(data[hr]||[]).map((c,i)=>({label:String(c||`Col ${i+1}`).trim(),idx:i}));
      const hl=hdrs.map(h=>h.label.toLowerCase());
      setConceptMapModal({
        data,hdrs,hr,sheetName,
        id:     guessConceptCol(hl,["id_concepto","id concepto","id","codigo","nro","número"]),
        nombre: guessConceptCol(hl,["nombre_largo","nombre de concepto","nombre largo","nombre","descripcion","concepto"]),
        unidad: guessConceptCol(hl,["nombre_largo_u","unidad","tipo de unidad","unidad (si","monto (si"]),
        tipo:   guessConceptCol(hl,["tipo_concepto","tipo de concepto","tipo concepto","tipo","grupo","remuner"]),
      });
    }catch(err){alert("Error leyendo archivo Meta4: "+err.message);}
  }

  function confirmConceptMap({data,hr,id,nombre,unidad,tipo,sheetName}){
    if(id<0||nombre<0){alert("Tenés que mapear al menos ID y Nombre de concepto.");return;}
    const concepts=parseMeta4ConceptFile(data,{id,nombre,unidad,tipo});
    if(!concepts.length){alert("No se encontraron conceptos válidos con ese mapeo.");return;}
    setClientMap({name:sheetName,concepts,updated:new Date().toLocaleString("es-AR")});

  function toggleTipoManual(map,setMap,idx){
    setMap(m=>({...m,concepts:m.concepts.map((c,i)=>{
      if(i!==idx)return c;
      const newTipo=c.tipoValor==="monto"?"cantidad":"monto";
      return{...c,tipoValor:newTipo,tipoManual:true};

  /* ═══════════════════════════════════════════
     SECCIÓN: NOVEDADES HANDLER
     handleNovFile — carga, análisis, detección
     de formato, auto-mapeo de columnas
     ═══════════════════════════════════════════ */
  /* ── Handle novedades files (multi) ── */
  async function handleNovFiles(fileList){
    const list=Array.from(fileList||[]);
    if(!list.length)return;
    const cli=clients.find(c=>c.id===selId);
    const effectiveSystem=cli?.system;
    const mapSource=getActiveMap(cli,axtonMap,clientMap);
    const sourceConcepts=mapSource?.concepts||cli?.concepts||[];
    /* Crear placeholders y añadirlos a la lista de inmediato (ítem #7) */
    const placeholders=list.map(file=>({
      id:Date.now()+"_"+Math.random().toString(36).slice(2,8),
      name:file.name,rawData:null,headers:[],hRow:0,analysis:null,detected:{},
      type:FILE_TYPES.loading.key,typeAuto:FILE_TYPES.loading.key,typeOverridden:false,isRowFormat:false,
      colLeg:"",colNom:"",colConcepto:"",colValor:"",colFecha:"",
      cMaps:[],hadFilter:false,errorMsg:null,validation:null,
    }));
    setFiles(fs=>[...fs,...placeholders]);
    if(step<3)setStep(3);
    /* Inicializar panel de progreso */
    setProcStatus({
      active:true,current:0,total:list.length,
      items:list.map(f=>({name:f.name,phase:"queued",progress:0})),
    });
    /* Helper para forzar repaint entre fases (microtask) */
    const tick=()=>new Promise(r=>setTimeout(r,0));
    for(let i=0;i<list.length;i++){
      const file=list[i];
      const pid=placeholders[i].id;
      const setItem=(patch)=>setProcStatus(s=>({...s,current:i,items:s.items.map((it,idx)=>idx===i?{...it,...patch}:it)}));
      try{
        setItem({phase:"reading",progress:20});await tick();
        const parsed=await parseExcel(file);
        const data=parsed.firstSheet;
        const hadFilter=!!parsed.hadFilter;
        setItem({phase:"analyzing",progress:55});await tick();
        const info=analyzeStructure(data,sourceErp);
        const hr=info.headerRow;
        const hdrs=(data[hr]||[]).map((c,i)=>({label:String(c||`Col ${i+1}`).trim(),idx:i}));
        const det=detectColumns(hdrs,info.detectedErp);
        const liIdx=det.legajo?.idx??hdrs.findIndex(h=>/legajo|leg\b/i.test(h.label));
        const niIdx=det.nombre?.idx??hdrs.findIndex(h=>/nombre|apellido/i.test(h.label));
        const coIdx=hdrs.findIndex(h=>{
          const n=normTxt(h.label);
          /* "Código de Concepto", "Cod Concepto", "Concepto" (cuando hay Valor/Monto), "Codigo" (cuando hay columna "Concepto") */
          return/c[oó]d(igo)?.*concepto/.test(n)
            ||(n==="concepto"&&hdrs.some(x=>/valor|monto|importe|cant/i.test(x.label)))
            ||(n==="codigo"&&hdrs.some(x=>normTxt(x.label)==="concepto"));
        });
        const vaIdx=hdrs.findIndex(h=>/\b(valor|monto|importe)\b/i.test(normTxt(h.label)));
        const feIdx=hdrs.findIndex(h=>{
          const n=normTxt(h.label);
          return/fecha.*imputac/.test(n)||/^fec.*imputac/.test(n)||/^fec_/.test(n)||n==="fecha";
        });
        const isRowFmt=coIdx>=0&&vaIdx>=0;
        /* ── Detección de tipo en cascada: Gestor (ERP) → Agrupador (posición) → error ── */
        let typeAuto=null,errorMsg=null;
        if(info.detectedErp==="axton"){typeAuto=FILE_TYPES.axton.key;}
        else{
          const byPos=detectTypeByPosition(hdrs.map(h=>h.label));
          if(byPos)typeAuto=byPos;
          else if(liIdx<0)errorMsg="No se encontró columna Legajo";
          else if(!isRowFmt&&!sourceConcepts.length)errorMsg="No se detectó tipo y no hay mapa de conceptos";
          else typeAuto=FILE_TYPES.mutual.key; /* fallback razonable */
        }
        /* Concepts auto-map para formato columna */
        let cMaps=[];
        if(!isRowFmt&&sourceConcepts.length){
          cMaps=sourceConcepts.map(c=>{
            const hint=(c.clientHint||c.nombre||c.name||"").toLowerCase();
            const ci=hdrs.findIndex(h=>hint&&h.label.toLowerCase().includes(hint));
            return{code:c.id||c.code,name:c.nombre||c.name,col:ci>=0?String(ci):"",tipoValor:c.tipoValor||"monto"};
          });
        }
        const newFile={
          id:Date.now()+"_"+Math.random().toString(36).slice(2,8),
          name:file.name,
          rawData:data,headers:hdrs,hRow:hr,analysis:info,detected:det,
          type:errorMsg?FILE_TYPES.error.key:typeAuto,
          typeAuto:errorMsg?FILE_TYPES.error.key:typeAuto,
          typeOverridden:false,
          isRowFormat:isRowFmt,
          colLeg:liIdx>=0?String(liIdx):"",
          colNom:niIdx>=0?String(niIdx):"",
          colConcepto:coIdx>=0?String(coIdx):"",
          colValor:vaIdx>=0?String(vaIdx):"",
          colFecha:feIdx>=0?String(feIdx):"",
          cMaps,hadFilter,errorMsg,validation:null,
        };
        setItem({phase:"validating",progress:80});await tick();
        if(validateOnLoad)newFile.validation=runValidationFor(newFile);
        patchFile(pid,newFile);
        setItem({phase:errorMsg?"error":"done",progress:100});
      }catch(err){
        patchFile(pid,{
          rawData:null,headers:[],hRow:0,analysis:null,detected:{},
          type:FILE_TYPES.error.key,typeAuto:FILE_TYPES.error.key,typeOverridden:false,isRowFormat:false,
          colLeg:"",colNom:"",colConcepto:"",colValor:"",colFecha:"",
          cMaps:[],hadFilter:false,errorMsg:"Error leyendo: "+err.message,validation:null,
        });
        setItem({phase:"error",progress:100});
      }
    }
    if(!selFileId&&placeholders.length)setSelFileId(placeholders[0].id);
    /* Mantener el panel un momento para que el usuario vea el ✓ y luego ocultar */
    setTimeout(()=>setProcStatus({active:false,current:0,total:0,items:[]}),700);
  }

  /* ═══════════════════════════════════════════
     SECCIÓN: VALIDATION & EXPORT
     runValidation, downloadValidationXls, doExport
     ═══════════════════════════════════════════ */
  /* ── Validation ── */
  function runValidationFor(file){
    if(!file||!file.rawData||file.colLeg==="")return null;
    const {rawData,hRow,colLeg,colConcepto,colValor,colFecha,isRowFormat,cMaps}=file;
    const li=parseInt(colLeg);
    const rows=rawData.slice(hRow+1).filter(r=>r.some(c=>c&&String(c).trim()));
    const nMap=new Map(nomina.map(e=>[String(e.legajo).trim(),e]));
    const cli=clients.find(c=>c.id===selId);
    const effectiveSystem=cli?.system;
    const mapSource=getActiveMap(cli,axtonMap,clientMap);
    const conceptLookup=new Map((mapSource?.concepts||[]).map(c=>[String(c.id),c]));
    const issues={noEnNomina:[],duplicados:[],conceptoNoEnMapa:[],tipoValorInvalido:[],valoresAltos:[],fechasFuera:[],vacios:[],valorNoNumerico:[],legajoDadoDeBaja:[]};
    const seenLegCon=new Map();
    const coIdx=colConcepto!==""?parseInt(colConcepto):-1;
    const vaIdx=colValor!==""?parseInt(colValor):-1;
    const feIdx=colFecha!==""?parseInt(colFecha):-1;
    const conceptStatsMap=new Map();
    const legajosUnicos=new Set();

    function parseFecha(s){
      const parts=s.split(/[\/\-\.]/);
      let m=-1,y=-1;
      if(parts.length>=3){
        if(parts[0].length===4){m=parseInt(parts[1]);y=parseInt(parts[0]);}
        else if(parts[2].length===4){m=parseInt(parts[0])<=12?parseInt(parts[0]):parseInt(parts[1]);y=parseInt(parts[2]);}
        else if(parts[2].length===2){m=parseInt(parts[0])<=12?parseInt(parts[0]):parseInt(parts[1]);y=2000+parseInt(parts[2]);}
      }
      return{m,y};
    }

    rows.forEach((row,i)=>{
      const leg=String(row[li]||"").trim();
      const rn=hRow+2+i;
      if(!leg){issues.vacios.push({row:rn,leg:"—",nombre:"—",msg:"Legajo vacío"});return;}
      legajosUnicos.add(leg);
      const emp=nMap.get(leg);
      const nombre=emp?.nombre||"";
      /* Legajo en nómina → ERROR */
      if(nomina.length>0&&!emp)
        issues.noEnNomina.push({row:rn,leg,nombre:"No encontrado",msg:`Legajo ${leg} no figura en nómina activa`});
      /* R3: Legajo dado de baja */
      if(nomina.length>0&&emp&&emp.fechaEgreso&&emp.fechaEgreso.trim()){
        const{m:em,y:ey}=parseFecha(emp.fechaEgreso.trim());
        if(ey>0&&(ey<period.year||(ey===period.year&&em>0&&em<period.month)))
          issues.legajoDadoDeBaja.push({row:rn,leg,nombre,msg:`Fecha de egreso ${emp.fechaEgreso.trim()} es anterior al período ${MONTHS_ES[period.month-1]} ${period.year}`});
      }

      if(isRowFormat){
        const codeCon=coIdx>=0?String(row[coIdx]||"").trim():"";
        const key=`${leg}|${codeCon}`;
        /* Duplicado legajo+concepto */
        if(codeCon){
          if(seenLegCon.has(key))
            issues.duplicados.push({row:rn,leg,nombre,msg:`Legajo ${leg} + Concepto ${codeCon} duplicado (1ª vez fila ${seenLegCon.get(key)})`});
          else seenLegCon.set(key,rn);
        }
        /* Concepto no en mapa */
        if(codeCon&&conceptLookup.size>0&&!conceptLookup.has(codeCon))
          issues.conceptoNoEnMapa.push({row:rn,leg,nombre,msg:`Concepto ${codeCon} no está en el mapa de conceptos del cliente`});
        /* Valor */
        if(vaIdx>=0){
          const valStr=String(row[vaIdx]||"").trim();
          if(valStr){
            const num=parseFloat(valStr.replace(/\./g,"").replace(",","."));
            if(isNaN(num)){
              issues.valorNoNumerico.push({row:rn,leg,nombre,msg:`Valor "${valStr}" no es numérico (Concepto: ${codeCon||"—"})`});
            }else{
              /* Tipo valor */
              const con=conceptLookup.get(codeCon);
              if(con&&con.tipoValor==="cantidad"&&num>999)
                issues.tipoValorInvalido.push({row:rn,leg,nombre,msg:`Concepto ${codeCon} (${con.nombre}) es de cantidad pero el valor ${valStr} parece un importe`});
              if(num>1000000)
                issues.valoresAltos.push({row:rn,leg,nombre,msg:`Valor ${num.toLocaleString("es-AR")} excede $1.000.000 (Concepto: ${codeCon})`});
              /* R6: estadísticas por concepto */
              if(codeCon){
                const cnombre=(conceptLookup.get(codeCon)?.nombre)||codeCon;
                if(!conceptStatsMap.has(codeCon))conceptStatsMap.set(codeCon,{nombre:cnombre,count:0,sum:0,min:Infinity,max:-Infinity,legajos:new Set()});
                const s=conceptStatsMap.get(codeCon);
                s.count++;s.sum+=num;s.min=Math.min(s.min,num);s.max=Math.max(s.max,num);s.legajos.add(leg);
              }
            }
          }
        }
        /* Fecha */
        if(feIdx>=0){
          const fechaStr=String(row[feIdx]||"").trim();
          if(fechaStr){
            const{m,y}=parseFecha(fechaStr);
            if(m>0&&!(m===period.month&&y===period.year))
              issues.fechasFuera.push({row:rn,leg,nombre,msg:`Fecha "${fechaStr}" no corresponde a ${MONTHS_ES[period.month-1]} ${period.year}`});
          }
        }
      }else{
        cMaps.forEach(m=>{
          if(m.col==="")return;
          const valStr=String(row[parseInt(m.col)]||"").trim();
          if(!valStr||valStr==="0")return;
          const key=`${leg}|${m.code}`;
          if(seenLegCon.has(key))
            issues.duplicados.push({row:rn,leg,nombre,msg:`Legajo ${leg} + Concepto ${m.name} (${m.code}) duplicado`});
          else seenLegCon.set(key,rn);
          /* Concepto en mapa */
          if(conceptLookup.size>0&&!conceptLookup.has(String(m.code)))
            issues.conceptoNoEnMapa.push({row:rn,leg,nombre,msg:`Concepto ${m.code} no está en el mapa`});
          const num=parseFloat(valStr.replace(/\./g,"").replace(",","."));
          if(isNaN(num)){
            issues.valorNoNumerico.push({row:rn,leg,nombre,msg:`Valor "${valStr}" no es numérico (Concepto: ${m.name||m.code})`});
          }else{
            if(m.tipoValor==="cantidad"&&num>999)
              issues.tipoValorInvalido.push({row:rn,leg,nombre,msg:`Concepto "${m.name}" es de cantidad pero valor ${valStr} parece importe`});
            if(num>1000000)
              issues.valoresAltos.push({row:rn,leg,nombre,msg:`Concepto "${m.name}" = ${valStr} excede $1.000.000`});
            /* R6 */
            const code=String(m.code);
            if(!conceptStatsMap.has(code))conceptStatsMap.set(code,{nombre:m.name||code,count:0,sum:0,min:Infinity,max:-Infinity,legajos:new Set()});
            const s=conceptStatsMap.get(code);
            s.count++;s.sum+=num;s.min=Math.min(s.min,num);s.max=Math.max(s.max,num);s.legajos.add(leg);
          }
        });
      }
    });
    const conceptStats=[...conceptStatsMap.entries()].map(([code,s])=>({
      code,nombre:s.nombre,count:s.count,sum:s.sum,avg:s.count>0?s.sum/s.count:0,
      min:s.min===Infinity?0:s.min,max:s.max===-Infinity?0:s.max,legajosCount:s.legajos.size
    })).sort((a,b)=>b.sum-a.sum);
    const allErrors=[...issues.vacios,...issues.noEnNomina,...issues.duplicados,...issues.valorNoNumerico,...issues.legajoDadoDeBaja];
    return{issues,errors:allErrors,warnings:[...issues.conceptoNoEnMapa,...issues.tipoValorInvalido,...issues.valoresAltos,...issues.fechasFuera],total:rows.length,ok:allErrors.length===0,legajosUnicos:legajosUnicos.size,conceptStats,importeTotal:conceptStats.reduce((a,b)=>a+b.sum,0)};
  }
  /* Valida todos los archivos cargados (no errores) */
  function runValidationAll(){
    setFiles(fs=>fs.map(f=>{
      if(f.type===FILE_TYPES.error.key)return f;
      const v=runValidationFor(f);
      return{...f,validation:v};
    }));
    setStep(Math.max(step,4));
  }

  /* ── Download validation report (del archivo seleccionado) ── */
  function downloadValidationXls(){
    const valid=selFile?.validation;
    if(!valid)return;
    const wb=XLSX.utils.book_new();

      if(!rows.length)return;

      XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
    };

    if(valid.issues.duplicados.length)    {const ws=XLSX.utils.aoa_to_sheet([cols,...toArr(valid.issues.duplicados)]);     XLSX.utils.book_append_sheet(wb,ws,"Duplicados");}
    if(valid.issues.conceptoNoEnMapa.length){const ws=XLSX.utils.aoa_to_sheet([cols,...toArr(valid.issues.conceptoNoEnMapa)]);XLSX.utils.book_append_sheet(wb,ws,"Conceptos no en Mapa");}
    if(valid.issues.tipoValorInvalido.length){const ws=XLSX.utils.aoa_to_sheet([cols,...toArr(valid.issues.tipoValorInvalido)]);XLSX.utils.book_append_sheet(wb,ws,"Tipo Valor Inválido");}
    if(valid.issues.valoresAltos.length)  {const ws=XLSX.utils.aoa_to_sheet([cols,...toArr(valid.issues.valoresAltos)]);  XLSX.utils.book_append_sheet(wb,ws,"Valores Altos");}
    if(valid.issues.fechasFuera.length)   {const ws=XLSX.utils.aoa_to_sheet([cols,...toArr(valid.issues.fechasFuera)]);   XLSX.utils.book_append_sheet(wb,ws,"Fechas Fuera Período");}
    if(valid.issues.vacios.length)        {const ws=XLSX.utils.aoa_to_sheet([cols,...toArr(valid.issues.vacios)]);        XLSX.utils.book_append_sheet(wb,ws,"Legajos Vacíos");}
    const resumen=[["Tipo","Cantidad","Tipo de issue"],
      ["Legajos no en nómina",valid.issues.noEnNomina.length,"Error"],
      ["Duplicados legajo+concepto",valid.issues.duplicados.length,"Error"],
      ["Legajos vacíos",valid.issues.vacios.length,"Error"],
      ["Concepto no en mapa",valid.issues.conceptoNoEnMapa.length,"Advertencia"],
      ["Tipo de valor inválido",valid.issues.tipoValorInvalido.length,"Advertencia"],
      ["Valores > $1.000.000",valid.issues.valoresAltos.length,"Advertencia"],
      ["Fechas fuera del período",valid.issues.fechasFuera.length,"Advertencia"],
      ["","",""],
      ["Total filas procesadas",valid.total,""],
      ["Estado",valid.ok?"Sin errores críticos":"HAY ERRORES CRÍTICOS",""],
    ];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(resumen),"Resumen");
    const cli=clients.find(c=>c.id===selId);
    XLSX.writeFile(wb,`Validacion_${(cli?.shortName||cli?.name||"").replace(/\s/g,"")}_${period.year}${String(period.month).padStart(2,"0")}.xlsx`);
  }

  /* ── Export agrupado por tipo (auto/mutual/axton) ── */
  function getMMAAAA(){return String(period.month).padStart(2,"0")+period.year;}
  function doExportGrouped(type){
    const group=files.filter(f=>f.type===type);
    if(!group.length)return;
    const cli=clients.find(c=>c.id===selId);
    const monthStr=`${MONTHS_ES[period.month-1]} ${period.year}`;
    if(type===FILE_TYPES.auto.key||type===FILE_TYPES.mutual.key){
      const first=group[0];
      /* Encabezados del primer archivo — sin clipear a A:K */
      const rawHeaders=(first.rawData[first.hRow]||[]).map(h=>String(h||"").trim());
      const masterHeaders=[...rawHeaders,"Archivo origen","Observaciones"];

      /* Índices de columnas numéricas y de fecha para formateo */
      const numCols=rawHeaders.reduce((a,h,i)=>{if(isNumericHeader(h))a.push(i);return a;},[]);
      const dateCols=rawHeaders.reduce((a,h,i)=>{if(isDateHeader(h))a.push(i);return a;},[]);
      /* Columna de valor/cantidad para detectar vacíos */
      const valColIdx=rawHeaders.findIndex(h=>/\b(valor|monto|importe|cant|cantidad)\b/i.test(normTxt(h)));

      const allRows=group.flatMap(f=>{
        const rows=f.rawData.slice(f.hRow+1)
          .filter(r=>r.some(c=>c!==null&&c!==undefined&&String(c).trim()!==""));
        return rows.map(r=>{
          const row=r.slice(0,rawHeaders.length);
          /* Alinear al ancho del master */
          while(row.length<rawHeaders.length)row.push("");
          /* Convertir numéricos */
          numCols.forEach(ci=>{
            const n=parseArgNum(row[ci]);
            if(n!==null)row[ci]=n;
          });
          /* Normalizar fechas → JS Date (Excel las renderizará con formato dd/mm/yyyy) */
          dateCols.forEach(ci=>{
            const d=parseDateAR(row[ci]);
            row[ci]=d?d:(row[ci]==null?"":String(row[ci]));
          });
          /* Detectar valor vacío (distinto de 0) */
          let obs="";
          if(valColIdx>=0){
            const v=row[valColIdx];
            if(v===""||v===null||v===undefined)obs="Valor vacío";
          }
          row.push(String(f.name||""),obs);
          return row;
        });
      });

      const ws=XLSX.utils.aoa_to_sheet([masterHeaders,...allRows],{cellDates:true});

      /* Aplicar formato numérico 0.00 (sin separador de miles) y fechas dd/mm/yyyy */
      if(allRows.length>0){
        const range=XLSX.utils.decode_range(ws["!ref"]);
        numCols.forEach(ci=>{
          for(let ri=1;ri<=range.e.r;ri++){
            const cell=ws[XLSX.utils.encode_cell({r:ri,c:ci})];
            if(cell&&cell.t==="n")cell.z="0.00";
          }
        });
        /* Formato fecha castellano (dd/mm/yyyy) sobre celdas que ya son Date/number */
        dateCols.forEach(ci=>{
          for(let ri=1;ri<=range.e.r;ri++){
            const cell=ws[XLSX.utils.encode_cell({r:ri,c:ci})];
            if(cell&&(cell.t==="d"||cell.t==="n"))cell.z="dd/mm/yyyy";
          }
        });
        /* Forzar columna "Archivo origen" como texto explícito ("@") para evitar
           que Excel intente convertirla por puntos/guiones en el nombre */
        const archivoColIdx=masterHeaders.length-2;
        for(let ri=1;ri<=range.e.r;ri++){
          const addr=XLSX.utils.encode_cell({r:ri,c:archivoColIdx});
          const cell=ws[addr];
          if(cell){cell.t="s";cell.v=String(cell.v==null?"":cell.v);cell.z="@";}
        }
      }

      ws["!cols"]=masterHeaders.map(h=>{
        const n=normTxt(h);
        if(n.includes("nombre")||n.includes("concepto"))return{wch:36};
        if(n.includes("fecha")||n.includes("fec"))return{wch:14};
        if(n.includes("archivo")||n.includes("observ"))return{wch:42};
        if(n.includes("legajo")||n.includes("codigo")||n.includes("valor")||n.includes("monto"))return{wch:16};
        return{wch:12};
      });
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Datos");
      const prefix=FILE_TYPES[type].badge;
      const fname=`${prefix}_${getMMAAAA()}_OTROS.xlsx`;
      XLSX.writeFile(wb,fname);
      const totalRows=allRows.length;
      const aggErr=group.reduce((s,f)=>s+(f.validation?.errors?.length||0),0);
      const aggWarn=group.reduce((s,f)=>s+(f.validation?.warnings?.length||0),0);
      setHistory(h=>[{id:Date.now(),client:cli?.name||"—",system:type,period:monthStr,
        rows:totalRows,file:fname,date:new Date().toLocaleString("es-AR"),isoDate:new Date().toISOString(),
        sourceErp,errors:aggErr,warnings:aggWarn},...h].slice(0,HISTORY_MAX));
      setStep(5);
      return;
    }
    /* Tipo axton: lógica original del Gestor, unificada */
    if(type===FILE_TYPES.axton.key){
      if(!cli){alert("Seleccioná un cliente para exportar Axton");return;}
      const dateStr=`${period.year}-${String(period.month).padStart(2,"0")}-25`;
      const concepts=group[0].cMaps.length?group[0].cMaps:(axtonMap?.concepts||[]);
      const r0=["Unidad Organizativa",cli.orgId||"",`${cli.name}${cli.convenio?"_"+cli.convenio:""}`,
        "Fecha","","","","",""];
      concepts.forEach(c=>r0.push(c.nombre||c.name||""));
      const r1=["Legajo","LNodNro","Apellido y Nombres","Cliente","U.O. Cliente","Sueldo",
        "Fecha Ingreso","Fecha Egreso","Fecha Ultimo Pago"];
      concepts.forEach(c=>r1.push(c.id||c.code||""));
      const out=[r0,r1];
      const nMap=new Map(nomina.map(e=>[String(e.legajo).trim(),e]));
      group.forEach(f=>{
        const li=parseInt(f.colLeg);
        const rows=f.rawData.slice(f.hRow+1).filter(r=>r.some(c=>c&&String(c).trim()));
        rows.forEach(row=>{
          const leg=String(row[li]||"").trim();
          const emp=nMap.get(leg)||{};
          const niIdx=f.colNom!==""?parseInt(f.colNom):-1;
          const nombre=niIdx>=0?String(row[niIdx]||""):(emp.nombre||"");
          const dr=[leg,emp.lnodNro||"",nombre,cli.name,emp.uo||cli.convenio||"",
            emp.sueldo||"",emp.fechaIngreso||"",emp.fechaEgreso||"",""];
          concepts.forEach(c=>{
            const m=f.cMaps.find(x=>(x.code||x.id)===c.id||(x.code||x.id)===c.code);
            dr.push(m&&m.col!==""?String(row[parseInt(m.col)]||""):"");
          });
          out.push(dr);
        });
      });
      const ws=XLSX.utils.aoa_to_sheet(out);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Novedades");
      const fname=`AXTON_${getMMAAAA()}_${(cli.shortName||cli.name).replace(/\s/g,"").slice(0,8)}.xlsx`;
      XLSX.writeFile(wb,fname);
      setHistory(h=>[{id:Date.now(),client:cli.name,system:"axton",period:monthStr,
        rows:out.length-2,file:fname,date:new Date().toLocaleString("es-AR"),isoDate:new Date().toISOString(),
        sourceErp,errors:0,warnings:0},...h].slice(0,HISTORY_MAX));
      setStep(5);
      return;
    }
  }

  function doDownloadReport(){
    if(!files.length)return;
    const wb=XLSX.utils.book_new();
    const h1=["Archivo","Tipo","Filas procesadas","Filtro activo","Errores","Advertencias","Estado"];
    const rows1=files.map(f=>{
      const lblTipo=FILE_TYPES[f.type]?.label||"—";
      const filas=f.rawData?f.rawData.slice(f.hRow+1).filter(r=>r.some(c=>c&&String(c).trim())).length:0;
      return[
        f.name,lblTipo,filas,
        f.hadFilter?"Sí (desactivado)":"No",
        f.validation?.errors?.length||0,
        f.validation?.warnings?.length||0,
        f.type===FILE_TYPES.error.key?(f.errorMsg||"Error"):"OK",
      ];
    });
    const ws1=XLSX.utils.aoa_to_sheet([h1,...rows1]);
    ws1["!cols"]=[{wch:42},{wch:22},{wch:18},{wch:18},{wch:12},{wch:14},{wch:36}];
    XLSX.utils.book_append_sheet(wb,ws1,"Detalle Archivos");
    /* Hoja 2: Por código de concepto */
    const counts={},nombres={};
    files.filter(f=>f.type!==FILE_TYPES.error.key).forEach(f=>{
      if(f.colConcepto===""||!f.rawData)return;
      const ci=parseInt(f.colConcepto);
      const ni=f.headers.findIndex(h=>/nombre\s*(de\s*)?concepto/i.test(h.label));
      const rows=f.rawData.slice(f.hRow+1).filter(r=>r.some(c=>c&&String(c).trim()));
      rows.forEach(row=>{
        const v=row[ci];if(v===null||v===undefined||v==="")return;
        const k=String(v).trim();
        counts[k]=(counts[k]||0)+1;
        if(!nombres[k]&&ni>=0&&row[ni])nombres[k]=String(row[ni]).trim();
      });
    });
    const h2=["Código de Concepto","Nombre de Concepto","Cantidad de Filas"];
    const rows2=Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0],"es",{numeric:true}))
      .map(([k,v])=>[k,nombres[k]||"—",v]);
    const total=rows2.reduce((s,r)=>s+r[2],0);
    rows2.push(["TOTAL","",total]);
    const ws2=XLSX.utils.aoa_to_sheet([h2,...rows2]);
    ws2["!cols"]=[{wch:22},{wch:40},{wch:20}];
    XLSX.utils.book_append_sheet(wb,ws2,"Por Código de Concepto");
    XLSX.writeFile(wb,`Reporte_${getMMAAAA()}.xlsx`);
  }

async function handleNominaFile(file){
  try{
    const {firstSheet:data}=await parseExcel(file);
    let emp=[];
    if(String(data[1]?.[0]||"").trim()==="Legajo"){
      emp=data.slice(2).filter(r=>r[0]&&String(r[0]).trim()).map(r=>({
        legajo:String(r[0]||"").trim(),lnodNro:String(r[1]||"").trim(),
        nombre:String(r[2]||"").trim(),uo:String(r[4]||"").trim(),sueldo:String(r[5]||"").trim(),
        fechaIngreso:String(r[6]||"").trim(),fechaEgreso:String(r[7]||"").trim(),
      }));
      setNomina(emp);setNomUpdated(new Date().toLocaleString("es-AR"));
    } else {
      const hr=findHRow(data);
      const hdrs=(data[hr]||[]).map((c,i)=>({label:String(c||`Col ${i+1}`).trim(),idx:i}));
      const guess=(hints)=>hdrs.findIndex(h=>hints.some(k=>h.label.toLowerCase().includes(k)));
      setNominaMapModal({
        data, hdrs, hr,
        legajo: guess(["legajo","id_empleado","nro_emp","nro emp","numero empleado","emp_id"]),
        nombre: guess(["apellido","nombre"]),
        uo:     guess(["u.o","unidad org","convenio","categ","centro_costo","sindicato","puesto","sector","area","departamento"]),
        fechaIngreso: guess(["fecha alta","fec_alta","fecha ingreso","fec_ingreso","fec_antiguedad","ingreso","alta"]),
      });
    }
  }catch(err){alert("Error leyendo nómina: "+err.message);}
}

    uo:           uo>=0?String(r[uo]||"").trim():"",

  setNominaMapModal(null);

                        <p style={{margin:0,fontSize:12,color:"var(--brand-primary)",fontWeight:500}}>Subir mapa de conceptos Meta 4</p>
                        <p style={{margin:0,fontSize:11,color:"var(--text-dim)"}}>Excel con hoja CONCEPTO_UNIDAD — auto-parseo + inferencia de tipo</p>
                      </div>
                    </label>
                  )
                )}
                {/* Concept map preview with tipo toggle */}
                {activeMap&&activeMap.concepts.length>0&&(
                  <div style={{marginTop:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                      <span style={{fontSize:11,color:"var(--text-dim)",textTransform:"uppercase",letterSpacing:1}}>Vista previa ({Math.min(8,activeMap.concepts.length)} de {activeMap.concepts.length})</span>
                    </div>
                    <div style={{maxHeight:200,overflow:"auto",borderRadius:8,border:"1px solid #334155"}}>
                      <table className="preview-table">
                        <thead><tr><th>ID</th><th>Nombre</th><th>{selCli?.system==="axton"?"Grupo":"Unidad"}</th><th>Tipo valor</th></tr></thead>
                        <tbody>{activeMap.concepts.slice(0,50).map((c,i)=>(
                          <tr key={i}>
                            <td style={{fontFamily:"monospace",color:"var(--brand-primary)"}}>{c.id}</td>
                            <td>{c.nombre}</td>
                            <td style={{color:"var(--text-muted)",fontSize:10}}>{c.grupo||c.unidadNombre||""}</td>
                            <td>
                              <button onClick={()=>toggleTipoManual(activeMap,selCli?.system==="axton"?setAxtonMap:setClientMap,i)}
                                style={{fontSize:10,padding:"2px 8px",borderRadius:4,cursor:"pointer",border:"none",fontWeight:600,
                                  background:c.tipoValor==="cantidad"?"rgba(34,211,238,.15)":"rgba(30,58,95,.22)",
                                  color:c.tipoValor==="cantidad"?"var(--brand-primary)":"#93c5fd"}}>
                                {c.tipoValor==="cantidad"?"# Cantidad":"$ Monto"}{c.tipoManual?"*":""}
                              </button>
                            </td>
                          </tr>
                        ))}</tbody>
                      </table>
                      {activeMap.concepts.length>50&&<p style={{fontSize:11,color:"var(--text-dim)",textAlign:"center",padding:6}}>... y {activeMap.concepts.length-50} más</p>}
                    </div>
                    <p style={{fontSize:10,color:"var(--border-strong)",marginTop:4}}>* = modificado manualmente · Click en el tipo para cambiarlo</p>
                  </div>
                )}
              </div>
            )}

            {/* Step 3: Multi-file upload + viewer */}
            {selId&&(
              <div className="card-step" style={{...S.card,marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <h2 style={{...S.h2,margin:0}}>④ Archivos de novedades (múltiples)</h2>
                  <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"var(--text-muted)",cursor:"pointer"}}>
                    <input type="checkbox" checked={validateOnLoad} onChange={e=>setValidateOnLoad(e.target.checked)}/>
                    Validar contra nómina y mapa de conceptos
                  </label>
                </div>
                <DropZone multiple onFiles={handleNovFiles}
                  label={`Arrastrá uno o más archivos de novedades${selCli?` de ${selCli.name}`:""}`}/>
                {/* Panel de progreso durante carga */}
                {procStatus.active&&(
                  <div style={{marginTop:14,padding:14,borderRadius:10,background:"rgba(24,183,232,.06)",border:"1px solid var(--brand-primary)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <span style={{fontSize:12,fontWeight:700,color:"var(--brand-primary)",textTransform:"uppercase",letterSpacing:1}}>
                        ⚙ Procesando {procStatus.current+1} de {procStatus.total}
                      </span>
                      <span style={{fontSize:11,color:"var(--text-muted)"}}>{Math.round(procStatus.items.reduce((s,it)=>s+it.progress,0)/procStatus.total)}%</span>
                    </div>
                    {/* Barra global */}
                    <div className="file-progress" style={{height:6,marginBottom:12}}>
                      <div className="file-progress-bar" style={{width:`${procStatus.items.reduce((s,it)=>s+it.progress,0)/procStatus.total}%`}}></div>
                    </div>
                    {/* Lista de archivos con su barra individual */}
                    <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:200,overflowY:"auto"}}>
                      {procStatus.items.map((it,idx)=>{
                        const phaseLbl={queued:"En cola",reading:"Leyendo…",analyzing:"Analizando…",validating:"Validando…",done:"Listo",error:"Error"}[it.phase]||it.phase;
                        const phaseIcon={queued:"⏳",reading:"📖",analyzing:"🔍",validating:"✓",done:"✅",error:"⚠"}[it.phase]||"•";
                        return(
                          <div key={idx}>
                            <div style={{display:"flex",alignItems:"center",gap:8,fontSize:11}}>
                              <span style={{flexShrink:0}}>{phaseIcon}</span>
                              <span style={{flex:1,color:"var(--text-bright)",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{it.name}</span>
                              <span style={{color:it.phase==="error"?"#dc2626":it.phase==="done"?"var(--brand-primary)":"var(--text-muted)",fontWeight:600,flexShrink:0}}>{phaseLbl}</span>
                            </div>
                            <div className="file-progress">
                              <div className={it.phase==="reading"||it.phase==="analyzing"?"file-progress-bar indeterminate":"file-progress-bar"}
                                   style={it.phase==="reading"||it.phase==="analyzing"?{}:{width:`${it.progress}%`,background:it.phase==="error"?"#dc2626":"var(--brand-primary)"}}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
                {files.length>0&&(
                  <div style={{marginTop:14}}>
                    {/* Resumen de grupos */}
                    <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                      {Object.values(FILE_TYPES).map(t=>{
                        const n=fileGroups[t.key].length,r=totalRows(fileGroups[t.key]);
                        if(!n)return null;
                        return(
                          <div key={t.key} style={{padding:"6px 12px",background:t.bg,border:`1px solid ${t.color}`,borderRadius:6,fontSize:11,color:t.color,fontWeight:600}}>
                            {t.groupLabel} · {n} {n===1?"archivo":"archivos"}{r>0?` · ${r} filas`:""}
                          </div>
                        );
                      })}
                    </div>
                    {/* Lista de archivos */}
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                      {files.map(f=>{
                        const isSel=f.id===selFileId;
                        const ft=FILE_TYPES[f.type];
                        const c=ft?.color||"var(--text-dim)";
                        const filas=f.rawData?f.rawData.slice(f.hRow+1).filter(r=>r.some(x=>x&&String(x).trim())).length:0;
                        const v=f.validation;
                        return(
                          <div key={f.id} onClick={()=>setSelFileId(f.id)}
                            className={"file-item"+(isSel?" file-item-sel":"")}
                            style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
                              borderRadius:8,cursor:"pointer",
                              background:isSel?"rgba(24,183,232,.08)":"var(--bg-base)",
                              border:`1px solid ${isSel?"var(--brand-primary)":"var(--border)"}`}}>
                            <span className={f.type===FILE_TYPES.loading.key?"badge-loading":""}
                              style={{fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:4,
                              background:c+"22",color:c,border:`1px solid ${c}`,minWidth:60,textAlign:"center"}}>
                              {ft?.badge||"?"}{f.typeOverridden?"*":""}
                            </span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:12,color:"var(--text-bright)",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.name}</div>
                              <div style={{fontSize:11,color:"var(--text-muted)"}}>
                                {f.type===FILE_TYPES.error.key?(<span style={{color:"#f87171"}}>{f.errorMsg}</span>):
                                  <>{filas} filas · {f.headers.length} cols
                                    {f.hadFilter&&<span style={{marginLeft:6,color:"#fbbf24"}}>🔍 filtros desactivados</span>}
                                    {f.isRowFormat&&<span style={{marginLeft:6,color:"var(--brand-primary)"}}>🔁 formato fila</span>}
                                    {v&&<span style={{marginLeft:8,color:v.errors.length>0?"#f87171":"var(--brand-primary)"}}>
                                      ✓ {v.errors.length} err · {v.warnings.length} adv
                                    </span>}
                                  </>}
                              </div>
                            </div>
                            <select value={f.type} onClick={e=>e.stopPropagation()}
                              onChange={e=>patchFile(f.id,{type:e.target.value,typeOverridden:e.target.value!==f.typeAuto})}
                              disabled={f.type===FILE_TYPES.loading.key}
                              style={{...S.select,width:120,fontSize:11,padding:"4px 6px",opacity:f.type===FILE_TYPES.loading.key?.5:1}}>
                              {f.type===FILE_TYPES.loading.key&&<option value={FILE_TYPES.loading.key}>Cargando…</option>}
                              <option value={FILE_TYPES.auto.key}>Auto (Fase Alta)</option>
                              <option value={FILE_TYPES.mutual.key}>Mutual (Incidencia)</option>
                              <option value={FILE_TYPES.axton.key}>Axton</option>
                              <option value={FILE_TYPES.error.key}>Error</option>
                            </select>
                            <button onClick={e=>{e.stopPropagation();setFiles(fs=>fs.filter(x=>x.id!==f.id));if(selFileId===f.id)setSelFileId(null);}}
                              style={{background:"none",border:"none",color:"var(--text-dim)",cursor:"pointer",fontSize:14,padding:4}}>✕</button>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{marginTop:10,display:"flex",gap:8,flexWrap:"wrap"}}>
                      <button onClick={()=>{setFiles([]);setSelFileId(null);}}
                        style={{...S.btn,...S.btnSecondary,fontSize:12,padding:"6px 12px"}}>🗑 Vaciar lista</button>
                      <button onClick={runValidationAll} disabled={!files.some(f=>f.type!==FILE_TYPES.error.key)}
                        style={{...S.btn,...S.btnPrimary,fontSize:12,padding:"6px 12px",opacity:files.some(f=>f.type!==FILE_TYPES.error.key)?1:.4}}>
                        ✓ Validar todos
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Step 4: Column mapping (selected file) */}
            {selFile&&selFile.rawData&&(
              <div className="card-step fade-in" style={{...S.card,marginBottom:12}}>
                <h2 style={S.h2}>⑤ Mapeo de columnas — {selFile.name}</h2>
                <AnalysisPanel analysis={selFile.analysis} detected={selFile.detected}/>
                <div style={{marginTop:10,marginBottom:14}}>
                  <DataPreview data={selFile.rawData} headerRow={selFile.hRow} detected={selFile.detected}/>
                </div>
                {selFile.isRowFormat?(
                  <div>
                    <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(34,211,238,.08)",border:"1px solid #0e7490",borderRadius:6,padding:"5px 12px",marginBottom:12,fontSize:12,color:"var(--brand-primary)"}}>
                      🔁 Pass-through — confirmá las columnas clave
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                      {[["Legajo *","colLeg"],["Nombre","colNom"],
                        ["Código Concepto","colConcepto"],["Valor","colValor"],
                        ["Fecha Imputación","colFecha"]
                      ].map(([lbl,key],i)=>(
                        <div key={i}>
                          <label style={{display:"block",fontSize:11,color:"var(--text-muted)",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>{lbl}</label>
                          <select value={selFile[key]} onChange={e=>patchFile(selFile.id,{[key]:e.target.value})} style={S.select}>
                            <option value="">— no mapeada —</option>
                            {selFile.headers.map((h,k)=><option key={k} value={String(h.idx)}>{h.label}</option>)}
                          </select>
                        </div>
                      ))}
                    </div>
                  </div>
                ):(
                  <div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                      <div>
                        <label style={{display:"block",fontSize:11,color:"var(--text-muted)",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Columna LEGAJO *</label>
                        <select value={selFile.colLeg} onChange={e=>patchFile(selFile.id,{colLeg:e.target.value})} style={S.select}>
                          <option value="">— no mapeada —</option>
                          {selFile.headers.map((h,i)=><option key={i} value={String(h.idx)}>{h.label}{selFile.detected.legajo?.idx===h.idx?" ✓":""}</option>)}
                        </select>
                      </div>
                      <div>
                        <label style={{display:"block",fontSize:11,color:"var(--text-muted)",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Columna NOMBRE</label>
                        <select value={selFile.colNom} onChange={e=>patchFile(selFile.id,{colNom:e.target.value})} style={S.select}>
                          <option value="">— no mapeada —</option>
                          {selFile.headers.map((h,i)=><option key={i} value={String(h.idx)}>{h.label}{selFile.detected.nombre?.idx===h.idx?" ✓":""}</option>)}
                        </select>
                      </div>
                    </div>
                    <div style={{borderTop:"1px solid #334155",paddingTop:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:conceptsOpen?10:0}}>
                        <button onClick={()=>setConceptsOpen(o=>!o)}
                          style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",cursor:"pointer",padding:0}}>
                          <span style={{fontSize:11,fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:2}}>
                            {conceptsOpen?"▾":"▸"} Conceptos a exportar
                          </span>
                          <span style={{fontSize:10,color:"var(--border-strong)"}}>({selFile.cMaps.length})</span>
                        </button>
                        {conceptsOpen&&(
                          <button onClick={()=>patchFile(selFile.id,f=>({cMaps:[...f.cMaps,{code:"",name:"",col:"",tipoValor:"monto"}]}))}
                            style={{fontSize:12,color:"var(--brand-primary)",background:"none",border:"none",cursor:"pointer"}}>+ Agregar</button>
                        )}
                      </div>
                      {conceptsOpen&&(
                        <div>
                          {selFile.cMaps.map((m,i)=>(
                            <div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
                              <input placeholder="Código" value={m.code} onChange={e=>patchFile(selFile.id,f=>({cMaps:f.cMaps.map((x,j)=>j===i?{...x,code:e.target.value}:x)}))}
                                style={{width:70,background:"var(--bg-select)",border:"1px solid var(--border-strong)",color:"var(--text)",borderRadius:6,padding:"5px 8px",fontSize:12,outline:"none"}}/>
                              <input placeholder="Nombre" value={m.name} onChange={e=>patchFile(selFile.id,f=>({cMaps:f.cMaps.map((x,j)=>j===i?{...x,name:e.target.value}:x)}))}
                                style={{flex:1,background:"var(--bg-select)",border:"1px solid var(--border-strong)",color:"var(--text)",borderRadius:6,padding:"5px 8px",fontSize:12,outline:"none"}}/>
                              <select value={m.col} onChange={e=>patchFile(selFile.id,f=>({cMaps:f.cMaps.map((x,j)=>j===i?{...x,col:e.target.value}:x)}))}
                                style={{width:160,background:"var(--bg-select)",border:"1px solid var(--border-strong)",color:"var(--text)",borderRadius:6,padding:"5px 8px",fontSize:12,outline:"none"}}>
                                <option value="">— sin mapear —</option>
                                {selFile.headers.map((h,k)=><option key={k} value={String(h.idx)}>{h.label}</option>)}
                              </select>
                              <button onClick={()=>patchFile(selFile.id,f=>({cMaps:f.cMaps.map((x,j)=>j===i?{...x,tipoValor:x.tipoValor==="monto"?"cantidad":"monto"}:x)}))}
                                style={{fontSize:10,padding:"4px 8px",borderRadius:4,cursor:"pointer",border:"none",fontWeight:600,flexShrink:0,
                                  background:m.tipoValor==="cantidad"?"rgba(34,211,238,.15)":"rgba(30,58,95,.22)",
                                  color:m.tipoValor==="cantidad"?"var(--brand-primary)":"#93c5fd"}}>
                                {m.tipoValor==="cantidad"?"#":"$"}
                              </button>
                              <button onClick={()=>patchFile(selFile.id,f=>({cMaps:f.cMaps.filter((_,j)=>j!==i)}))}
                                style={{color:"var(--text-dim)",cursor:"pointer",background:"none",border:"none",fontSize:12}}>✕</button>
                            </div>
                          ))}
                          {!selFile.cMaps.length&&<p style={{color:"var(--border-strong)",fontSize:12,fontStyle:"italic"}}>Sin conceptos. Se agregarán del mapa si hay uno cargado.</p>}
                        </div>
                      )}
                    </div>
                  </div>
                )}
                <button onClick={()=>patchFile(selFile.id,{validation:runValidationFor(selFile)})} disabled={selFile.colLeg===""}
                  style={{...S.btn,...S.btnPrimary,width:"100%",marginTop:16,opacity:selFile.colLeg===""?.4:1,cursor:selFile.colLeg===""?"not-allowed":"pointer"}}>
                  Validar este archivo →
                </button>
              </div>
            )}

           {/* Step 5: Validation results (selected file) */}
{selFile&&selFile.validation&&<ValidationPanel validation={selFile.validation} fileName={selFile.name} onDownload={downloadValidationXls} period={period}/>}

            {/* Step 6: Export agrupado */}
            {files.length>0&&(
              <div className="card-step" style={{...S.card,marginBottom:12}}>
                <h2 style={S.h2}>⑦ Exportar agrupado por tipo</h2>
                {aggValidation.validated>0&&(
                  <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",fontSize:11,color:"var(--text-muted)"}}>
                    <span>Validados: <strong style={{color:"var(--text-bright)"}}>{aggValidation.validated}</strong></span>
                    <span style={{color:aggValidation.errors>0?"#f87171":"var(--brand-primary)"}}>Errores: <strong>{aggValidation.errors}</strong></span>
                    <span style={{color:aggValidation.warnings>0?"#fbbf24":"var(--brand-primary)"}}>Advertencias: <strong>{aggValidation.warnings}</strong></span>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <button className="export-btn" onClick={()=>doExportGrouped(FILE_TYPES.auto.key)} disabled={!fileGroups.auto.length}
                    style={{padding:"14px 18px",borderRadius:10,border:"none",fontWeight:700,fontSize:14,color:"#fff",
                      background:FILE_TYPES.auto.color,cursor:fileGroups.auto.length?"pointer":"not-allowed",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    ⬇ {FILE_TYPES.auto.label}
                    <span style={{fontSize:12,fontWeight:400,opacity:.85}}>({fileGroups.auto.length} {fileGroups.auto.length===1?"archivo":"archivos"})</span>
                  </button>
                  <button className="export-btn" onClick={()=>doExportGrouped(FILE_TYPES.mutual.key)} disabled={!fileGroups.mutual.length}
                    style={{padding:"14px 18px",borderRadius:10,border:"none",fontWeight:700,fontSize:14,color:"#fff",
                      background:FILE_TYPES.mutual.color,cursor:fileGroups.mutual.length?"pointer":"not-allowed",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    ⬇ {FILE_TYPES.mutual.label}
                    <span style={{fontSize:12,fontWeight:400,opacity:.85}}>({fileGroups.mutual.length} {fileGroups.mutual.length===1?"archivo":"archivos"})</span>
                  </button>
                  <button className="export-btn" onClick={()=>doExportGrouped(FILE_TYPES.axton.key)} disabled={!fileGroups.axton.length}
                    style={{padding:"14px 18px",borderRadius:10,border:"none",fontWeight:700,fontSize:14,color:"#fff",
                      background:FILE_TYPES.axton.color,cursor:fileGroups.axton.length?"pointer":"not-allowed",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    ⬇ {FILE_TYPES.axton.label}
                    <span style={{fontSize:12,fontWeight:400,opacity:.85}}>({fileGroups.axton.length} {fileGroups.axton.length===1?"archivo":"archivos"})</span>
                  </button>
                  <button className="export-btn" onClick={doDownloadReport}
                    style={{padding:"14px 18px",borderRadius:10,border:"none",fontWeight:700,fontSize:14,color:"#fff",
                      background:"var(--brand-secondary)",cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    📊 Reporte de validación
                  </button>
                </div>
                <p style={{fontSize:11,color:"var(--text-dim)",marginTop:6}}>
                  Cada grupo se exporta a un único xlsx unificando los archivos del mismo tipo. Nombres: AUTO_{getMMAAAA()}_OTROS.xlsx, MUTUAL_{getMMAAAA()}_OTROS.xlsx.
                </p>
              </div>
            )}

            {/* Done */}
            {step===5&&(
              <div className="fade-in" style={{background:"rgba(24,183,232,.14)",border:"1px solid var(--brand-primary)",borderRadius:12,padding:24,textAlign:"center"}}>
                <div style={{fontSize:44,marginBottom:10}}>🎉</div>
                <p style={{color:"var(--brand-primary)",fontWeight:700,fontSize:18}}>¡Archivo(s) generado(s)!</p>
                <p style={{color:"var(--text-muted)",fontSize:13,marginTop:4}}>La descarga debería iniciarse automáticamente.</p>
                <button onClick={()=>{setStep(1);setSelId("");resetProcessing();setSourceErp("otro");}}
                  style={{...S.btn,...S.btnSecondary,marginTop:14}}>Procesar otro cliente →</button>
              </div>
            )}
          </div>
        )}

        {/* ═══ CLIENTES ═══ */}
        {tab==="clientes"&&(
          <div style={{maxWidth:1100,margin:"0 auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h2 style={{fontSize:20,fontWeight:700,color:"var(--text-bright)",margin:0}}>Clientes <span style={{fontSize:13,fontWeight:400,color:"var(--text-dim)"}}>({clients.length})</span></h2>
              <div style={{display:"flex",gap:10}}>
                <label style={{cursor:"pointer",fontSize:12,color:"var(--brand-primary)",display:"flex",alignItems:"center",gap:4,padding:"7px 12px",background:"var(--bg-card)",border:"1px solid #334155",borderRadius:8}}>
                  📥 Importar JSON
                  <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{
                    const f=e.target.files?.[0];if(!f)return;
                    const r=new FileReader();
                    r.onload=ev=>{try{const c=JSON.parse(ev.target.result);saveClient({...c,id:null});}catch{alert("JSON inválido");}};
                    r.readAsText(f);e.target.value="";
                  }}/>
                </label>
                <button onClick={()=>{setEditCli({name:"",shortName:"",system:"meta4",orgId:"",convenio:"",concepts:[]});setModal(true);}}
                  style={{...S.btn,...S.btnPrimary}}>+ Nuevo cliente</button>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
              {clients.map(c=>(
                <div key={c.id} style={S.card}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div>
                      <h3 style={{fontWeight:700,color:"var(--text-bright)",margin:0,fontSize:14}}>{c.name}</h3>

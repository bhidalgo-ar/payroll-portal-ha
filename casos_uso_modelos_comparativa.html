<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cómo usar Claude — Payroll & HR</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div style="font-family:'Lora',Georgia,serif;background:#faf9f5;color:#141413;line-height:1.6;min-height:100vh;">

  <div style="background:#141413;padding:11px 28px;display:flex;align-items:center;gap:10px;">
    <svg width="24" height="24" viewBox="0 0 100 100" style="flex-shrink:0;display:block;" aria-label="Claude" role="img"><g stroke="#d97757" stroke-width="11" stroke-linecap="round"><line x1="50" y1="11" x2="50" y2="89"/><line x1="11" y1="50" x2="89" y2="50"/><line x1="22.4" y1="22.4" x2="77.6" y2="77.6"/><line x1="77.6" y1="22.4" x2="22.4" y2="77.6"/></g></svg>
    <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:500;color:#f0ece4;letter-spacing:-0.1px;">Claude</span>
    <span style="color:#4a4640;font-size:14px;margin:0 2px;">·</span>
    <span style="font-size:13px;color:#877f74;">Cómo usar Claude — Payroll &amp; HR</span>
  </div>

  <div id="app"></div>

</div>

<template id="tpl">
  <div style="max-width:1200px;margin:0 auto;padding:36px 24px 48px;" data-screen-label="Comparativa de modelos">

    <div style="margin-bottom:28px;">
      <h1 style="font-family:'Poppins',Arial,sans-serif;font-size:28px;font-weight:600;color:#141413;letter-spacing:-0.3px;margin-bottom:6px;">Cómo usar Claude en Payroll</h1>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap;">
        <span style="background:#e8e6dc;color:#726c62;font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:3px 9px;border-radius:20px;">Guía interna · v11</span>
        <span style="font-size:11px;color:#b0aea5;">Datos verificados al 27 de julio de 2026</span>
      </div>
      <p style="font-size:14px;color:#726c62;max-width:760px;">Elegí qué tenés que hacer y la guía te dice con qué herramienta, qué modelo y si conviene prender thinking. Si querés el detrás de escena, está todo abajo — cerrado, para abrir solo lo que busques.</p>
      <div style="background:#fdf1ec;border-left:3px solid #d97757;border-radius:0 8px 8px 0;padding:11px 15px;margin-top:14px;max-width:860px;">
        <div style="font-size:12.5px;color:#141413;line-height:1.7;"><strong style="color:#a8532f;">Actualizado el 27 de julio de 2026:</strong> el escalón Opus de esta guía ahora es <strong style="color:#141413;">Opus 5</strong>, que salió el 24 de julio y reemplazó al escalón anterior. Rinde bastante más sin consumir más cupo, así que <strong style="color:#141413;">escalar de Sonnet a Opus rinde más que antes</strong> y llegar hasta Fable 5 hace falta menos seguido: <strong style="color:#141413;">seguí arrancando por Sonnet</strong>.</div>
      </div>
    </div>


    <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;padding:14px 16px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:9px;">
        <span style="font-size:15px;">🔎</span>
        <input type="text" value="{{ search.query }}" placeholder="Buscá lo que necesitás: SAC, cruce, Excel, recibo, thinking, DNI, Cowork…" oninput="{{ search.onInput }}" style="flex:1;border:none;outline:none;background:transparent;font-family:'Lora',Georgia,serif;font-size:13.5px;color:#141413;min-width:0;">
        <sc-if value="{{ search.hasQuery }}">
          <button onClick="{{ search.clear }}" style="background:#f2f0ea;border:1px solid #d5d0c6;border-radius:7px;padding:4px 10px;cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:600;color:#726c62;">Limpiar</button>
        </sc-if>
      </div>
      <sc-if value="{{ search.hasQuery }}">
        <div style="margin-top:12px;border-top:1px solid #f0ece4;padding-top:10px;">
          <sc-if value="{{ search.hasResults }}">
            <div style="display:flex;flex-direction:column;gap:5px;">
              <sc-for list="{{ search.results }}" as="r" hint-placeholder-count="4">
                <button onClick="{{ r.onClick }}" style="background:#faf9f5;border:1px solid #e8e6dc;border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;">
                  <span style="background:{{ r.kindBg }};color:{{ r.kindColor }};font-family:'Poppins',Arial,sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:3px 7px;border-radius:5px;flex-shrink:0;">{{ r.kind }}</span>
                  <span style="font-family:'Lora',Georgia,serif;font-size:12.5px;color:#141413;">{{ r.label }}</span>
                  <span style="font-size:11px;color:#877f74;">{{ r.hint }}</span>
                </button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ search.noResults }}">
            <div style="font-size:12px;color:#877f74;line-height:1.6;">Sin resultados para "{{ search.query }}". Probá con una palabra más corta: cupo, thinking, Excel, cliente, DNI, deck.</div>
          </sc-if>
        </div>
      </sc-if>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px;">
      <sc-for list="{{ toolTiles }}" as="t" hint-placeholder-count="4">
        <button onClick="{{ t.onClick }}" style="background:{{ t.bg }};border:1.5px solid {{ t.border }};border-radius:10px;padding:11px 13px;cursor:pointer;text-align:left;">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap;">
            <span style="font-size:14px;">{{ t.icon }}</span>
            <span style="font-family:'Poppins',Arial,sans-serif;font-size:12.5px;font-weight:700;color:{{ t.color }};">{{ t.name }}</span>
            <sc-if value="{{ t.suggested }}"><span style="background:rgba(120,140,93,0.16);color:#5a6b45;font-family:'Poppins',Arial,sans-serif;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:2px 6px;border-radius:5px;">Sugerida</span></sc-if>
          </div>
          <div style="font-size:11px;color:#726c62;line-height:1.5;">{{ t.one }}</div>
        </button>
      </sc-for>
    </div>

    <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#b0aea5;margin:16px 0 8px;">¿Qué tenés que hacer?</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
      <sc-for list="{{ caseChips }}" as="c" hint-placeholder-count="8">
        <button onClick="{{ c.onClick }}" style="background:{{ c.bg }};border:1.5px solid {{ c.border }};border-radius:20px;padding:6px 13px;cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:{{ c.weight }};color:{{ c.color }};">{{ c.label }}</button>
      </sc-for>
    </div>

    <div style="background:#ffffff;border:2px solid rgba(120,140,93,0.5);border-radius:12px;padding:20px 24px;margin-bottom:20px;">
      <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#5a6b45;margin-bottom:8px;">La respuesta · {{ answer.caseTitle }}</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
        <span style="background:{{ answer.modelBg }};color:{{ answer.modelColor }};font-family:'Poppins',Arial,sans-serif;font-size:16px;font-weight:700;padding:4px 12px;border-radius:8px;">{{ answer.model }}</span>
        <span style="font-size:13px;color:#877f74;">·</span>
        <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:600;color:#141413;">thinking {{ answer.thinking }}</span>
        <span style="font-size:13px;color:#877f74;">·</span>
        <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:600;color:#141413;">en {{ answer.tool }}</span>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;">
        <span style="background:#f2f0ea;color:#726c62;font-family:'Poppins',Arial,sans-serif;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;">cupo {{ answer.cupo }}</span>
        <span style="background:#f2f0ea;color:#726c62;font-family:'Poppins',Arial,sans-serif;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;">esfuerzo {{ answer.effort }}</span>
      </div>
      <div style="font-size:12.5px;color:#141413;line-height:1.7;margin-bottom:6px;">{{ answer.escalate }}</div>
      <div style="font-size:12px;color:#726c62;line-height:1.7;">{{ answer.toolAlt }}</div>
      <sc-if value="{{ answer.folderWarning }}">
        <div style="background:#fff8e1;border-left:3px solid #d97757;border-radius:0 8px 8px 0;padding:10px 13px;margin-top:11px;font-size:12px;color:#5d4037;line-height:1.65;">📁 Cowork lee la carpeta entera, no lo que vos elegís pegar. Mirá qué hay adentro antes de darle acceso — un export de liquidación tiene DNI y CUIL en las columnas.</div>
      </sc-if>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;">
        <button onClick="{{ answer.openWhy }}" style="background:#faf9f5;border:1px solid #d5d0c6;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-size:11.5px;font-weight:600;color:#726c62;">¿Por qué este modelo? →</button>
        <button onClick="{{ answer.openToolSection }}" style="background:#faf9f5;border:1px solid #d5d0c6;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-size:11.5px;font-weight:600;color:#726c62;">Cómo se usa {{ answer.tool }} →</button>
      </div>
    </div>

    <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#b0aea5;margin:22px 0 8px;">Si querés leer más — todo cerrado, abrí solo lo que busques</div>

    <sc-if value="{{ secWhy.visible }}">
      <div id="sec-why" style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;margin-bottom:9px;">
        <button onClick="{{ secWhy.toggle }}" style="width:100%;background:{{ secWhy.headBg }};border:none;border-radius:12px;padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;">
          <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-size:15px;">🎯</span>
            <span style="font-family:'Poppins',Arial,sans-serif;font-size:13.5px;font-weight:600;color:#141413;">¿Por qué este modelo y no otro?</span>
            <span style="font-size:11.5px;color:#877f74;">la recomendación completa y la escalera confianza / cupo</span>
          </span>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:15px;color:#a8532f;flex-shrink:0;">{{ secWhy.chev }}</span>
        </button>
        <sc-if value="{{ secWhy.open }}">
          <div style="padding:4px 18px 18px;">
        <div style="background:#fdf1ec;border-left:3px solid #d97757;border-radius:0 8px 8px 0;padding:13px 16px;margin-bottom:22px;">
          <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#a8532f;margin-bottom:5px;">Recomendación</div>
          <div style="font-size:13.5px;color:#141413;line-height:1.75;">
            <sc-for list="{{ selectedCase.verdictParts }}" as="seg" hint-placeholder-count="3">
              <sc-if value="{{ seg.isModel }}">
                <span style="background:{{ seg.colorBg }};color:{{ seg.color }};font-weight:700;padding:1px 7px;border-radius:6px;">{{ seg.text }}</span>
              </sc-if>
              <sc-if value="{{ seg.isText }}">{{ seg.text }}</sc-if>
            </sc-for>
          </div>
        </div>

        <sc-if value="{{ showLadder }}" hint-placeholder-val="{{ true }}">
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;padding:20px 24px;margin-bottom:22px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
              <div>
                <div style="font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:600;color:#141413;">Confianza frente a consumo de cupo</div>
                <div style="font-size:12px;color:#726c62;margin-top:2px;max-width:520px;">Qué tan seguido el modelo entrega un resultado usable sin rehacer el pedido — y cuánto cupo se come ese nivel. El salto grande es de Haiku a Sonnet; de ahí en más gastás bastante más cupo por unos pocos puntos.</div>
              </div>
              <div style="background:#faf9f5;border:1px dashed #cfc9bd;border-radius:8px;padding:8px 11px;font-size:10.5px;color:#877f74;line-height:1.5;max-width:236px;flex-shrink:0;">📌 Estimación interna del equipo, basada en casos reales de Payroll. No es un benchmark publicado por Anthropic. La fila de Opus se midió con el escalón Opus anterior: con Opus 5 debería dar igual o mejor.</div>
            </div>

            <div style="display:flex;flex-direction:column;gap:0;margin-top:16px;">
              <sc-for list="{{ selectedCase.rungs }}" as="r" hint-placeholder-count="4">
                <sc-if value="{{ r.deltaBig }}">
                  <div style="display:flex;align-items:center;gap:9px;padding:7px 0 7px 168px;flex-wrap:wrap;">
                    <span style="background:#fdf1ec;border:1px solid rgba(217,119,87,0.4);color:#a8532f;border-radius:20px;padding:3px 11px;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;white-space:nowrap;">▲ {{ r.deltaConf }} · {{ r.costMult }} el cupo</span>
                    <span style="font-size:11px;color:#a8532f;font-style:italic;">{{ r.deltaNote }}</span>
                  </div>
                </sc-if>
                <sc-if value="{{ r.deltaSmall }}">
                  <div style="display:flex;align-items:center;gap:9px;padding:7px 0 7px 168px;">
                    <span style="background:#f2f0ea;border:1px solid #d5d0c6;color:#726c62;border-radius:20px;padding:3px 11px;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;white-space:nowrap;">▲ {{ r.deltaConf }} · {{ r.costMult }} el cupo</span>
                    <span style="font-size:11px;color:#a09a8f;">rinde cada vez menos</span>
                  </div>
                </sc-if>

                <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                  <div style="flex:0 0 154px;min-width:154px;">
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                      <span style="font-family:'Poppins',Arial,sans-serif;font-size:13.5px;font-weight:700;color:{{ r.color }};white-space:nowrap;">{{ r.name }}</span>
                      <sc-if value="{{ r.isSweet }}"><span style="background:rgba(120,140,93,0.16);color:#5a6b45;font-family:'Poppins',Arial,sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:2px 6px;border-radius:5px;white-space:nowrap;">★ Arrancá acá</span></sc-if>
                    </div>
                    <div style="font-size:10.5px;color:#877f74;margin-top:1px;">{{ r.role }}</div>
                  </div>
                  <div style="flex:1;min-width:190px;display:flex;align-items:center;gap:10px;">
                    <div style="flex:1;height:22px;background:#f2f0ea;border-radius:6px;overflow:hidden;">
                      <div style="height:100%;width:{{ r.confPct }}%;background:{{ r.color }};border-radius:6px;min-width:3px;"></div>
                    </div>
                    <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:700;color:{{ r.color }};width:38px;text-align:right;">{{ r.conf }}%</span>
                  </div>
                  <div style="flex:0 0 132px;min-width:132px;display:flex;align-items:center;gap:8px;">
                    <div style="flex:1;height:6px;background:#f2f0ea;border-radius:3px;overflow:hidden;"><div style="height:100%;width:{{ r.costPct }}%;background:#d97757;border-radius:3px;"></div></div>
                    <span style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#a8532f;white-space:nowrap;">{{ r.costLabel }}<span style="color:#b0aea5;font-weight:600;"> cupo</span></span>
                  </div>
                </div>
              </sc-for>
            </div>

            <div style="display:flex;gap:18px;margin-top:16px;padding-top:12px;border-top:1px solid #f0ece4;flex-wrap:wrap;">
              <div style="display:flex;align-items:center;gap:7px;"><span style="width:22px;height:9px;border-radius:3px;background:#788c5d;display:inline-block;flex-shrink:0;"></span><span style="font-size:11px;color:#726c62;">Barra ancha = confianza en el primer intento</span></div>
              <div style="display:flex;align-items:center;gap:7px;"><span style="width:22px;height:6px;border-radius:3px;background:#d97757;display:inline-block;flex-shrink:0;"></span><span style="font-size:11px;color:#726c62;">Barra fina = consumo de cupo relativo</span></div>
            </div>
          </div>
        </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ secTools.visible }}">
      <div id="sec-tools" style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;margin-bottom:9px;">
        <button onClick="{{ secTools.toggle }}" style="width:100%;background:{{ secTools.headBg }};border:none;border-radius:12px;padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;">
          <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-size:15px;">🧭</span>
            <span style="font-family:'Poppins',Arial,sans-serif;font-size:13.5px;font-weight:600;color:#141413;">¿Chat, Cowork, Code o Design?</span>
            <span style="font-size:11.5px;color:#877f74;">las dos preguntas y las cuatro herramientas con ejemplos</span>
          </span>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:15px;color:#a8532f;flex-shrink:0;">{{ secTools.chev }}</span>
        </button>
        <sc-if value="{{ secTools.open }}">
          <div style="padding:4px 18px 18px;">
      <div style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#a8532f;margin-bottom:4px;">Antes que el modelo — ¿Chat, Cowork, Code o Design?</div>
      <div style="font-size:12.5px;color:#726c62;line-height:1.7;margin-bottom:14px;max-width:860px;">No es "qué tan complejo es". Son dos preguntas, en este orden.</div>

      <div style="background:#fdf1ec;border-left:4px solid #d97757;border-radius:0 9px 9px 0;padding:13px 16px;margin-bottom:10px;">
        <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#a8532f;margin-bottom:5px;">1 · La regla principal de la guía</div>
        <div style="font-size:13.5px;color:#141413;line-height:1.75;">¿Alguien más lo va a abrir, o lo vas a necesitar de nuevo? <strong style="color:#141413;">Si le sirve a alguien más que a vos, o lo vas a necesitar de nuevo, y es una página del portal, va por Code — aunque sea más rápido hacerlo en Chat.</strong></div>
      </div>
      <div style="background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:13px 16px;margin-bottom:16px;">
        <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#726c62;margin-bottom:5px;">2 · Quién hace el trabajo</div>
        <div style="font-size:12.5px;color:#141413;line-height:1.75;">¿Querés que Claude haga el trabajo sobre tus archivos, o que te ayude a hacerlo vos? Que lo haga él, sobre varios archivos y varios pasos → <strong style="color:#141413;">Cowork</strong>. Que te ayude a vos, en un ida y vuelta → <strong style="color:#141413;">Chat</strong>.</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;">
        <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:14px 15px;">
          <div style="display:flex;align-items:center;gap:7px;padding-bottom:8px;margin-bottom:9px;border-bottom:2px solid #6a9bcc;"><span style="font-size:14px;">💬</span><span style="font-family:'Poppins',Arial,sans-serif;font-size:13.5px;font-weight:700;color:#3d6690;">Chat</span></div>
          <div style="font-size:12px;color:#141413;line-height:1.65;margin-bottom:8px;">Es una <strong style="color:#141413;">conversación</strong>. Vos hacés el trabajo; Claude te ayuda a pensarlo, entenderlo o redactarlo. No toca tus archivos.</div>
          <div style="font-size:11.5px;color:#726c62;line-height:1.6;">Entender una fórmula heredada · redactar un mail a un cliente · un simulador rápido para verificar un caso · pensar opciones antes de decidir.</div>
          <div style="font-size:11.5px;color:#a8532f;line-height:1.6;margin-top:7px;">✕ No la uses cuando el resultado lo va a abrir alguien más la semana que viene.</div>
        </div>
        <div style="background:#ffffff;border:1.5px solid rgba(120,140,93,0.45);border-radius:10px;padding:14px 15px;">
          <div style="display:flex;align-items:center;gap:7px;padding-bottom:8px;margin-bottom:9px;border-bottom:2px solid #788c5d;flex-wrap:wrap;"><span style="font-size:14px;">🧑‍💻</span><span style="font-family:'Poppins',Arial,sans-serif;font-size:13.5px;font-weight:700;color:#5a6b45;">Cowork</span><span style="background:#d97757;color:#fff;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:2px 6px;border-radius:20px;font-family:'Poppins',Arial,sans-serif;">Nuevo</span></div>

          <div style="font-size:12.5px;color:#141413;line-height:1.7;">🧑‍💻 <strong style="color:#141413;">Esta sección es para todo el equipo</strong>, no solo para IT. Cowork es la herramienta que hace el trabajo por vos sobre tus archivos — Excel, informes, cruces, decks — sin escribir una línea de código y sin terminal. Está incluida en el plan Team de H&amp;A.</div>
        </div>

        <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:16px 18px;margin-bottom:22px;">
          <p style="font-size:13px;color:#141413;line-height:1.75;"><strong style="color:#141413;">Claude Cowork</strong> usa la misma arquitectura agéntica que Claude Code, pero sin terminal. En vez de responder de a un mensaje, <strong style="color:#141413;">toma una tarea de varios pasos y la ejecuta</strong>: abre tus archivos, arma el entregable y te lo deja hecho. Vos le describís el resultado que querés, no los pasos.</p>
          <p style="font-size:13px;color:#141413;line-height:1.75;margin-top:8px;"><strong style="color:#141413;">Dónde está:</strong> en los planes pagos (Pro, Max, Team, Enterprise) — el plan Team de H&amp;A lo incluye. Corre en Claude Desktop para macOS y Windows, en la web y en mobile. Chat y Cowork comparten el mismo cuadro de mensaje: se elige "Cowork" ahí y se describe la tarea.</p>
          <p style="font-size:13px;color:#141413;line-height:1.75;margin-top:8px;"><strong style="color:#141413;">Requisitos:</strong> plan pago y conexión a internet. Para que lea archivos locales, use el navegador o la computadora, hace falta tener la <strong style="color:#141413;">app de escritorio abierta y conectada</strong>.</p>
        </div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Primeros pasos (para quien nunca lo usó)</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#788c5d;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">1</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Abrí Claude</strong> (escritorio, web o mobile) y en el cuadro de mensaje elegí <strong style="color:#141413;">"Cowork"</strong> en vez de "Chat".</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#788c5d;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">2</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Describí el resultado que querés</strong>, no los pasos. Cowork planifica solo (ej: "cruzá el export de liquidación de julio contra el archivo contable y dejame un informe con las diferencias agrupadas por concepto").</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#788c5d;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">3</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Revisá el plan</strong> que propone antes de dejarlo correr.</div>
          </div>
          <div style="display:flex;gap:12px;background:#fdf1ec;border:1.5px solid rgba(217,119,87,0.3);border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#d97757;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">4</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Elegí el modo de permisos</strong> (el detalle está abajo). Para empezar: <strong style="color:#a8532f;">Manual</strong>.</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#788c5d;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">5</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Seguí el avance.</strong> Muestra qué archivos abre, qué herramientas usa y qué decide. Podés corregir el rumbo en el medio, sin esperar a que termine.</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#788c5d;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">6</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Revisá el entregable</strong> antes de darlo por bueno.</div>
          </div>
        </div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Los tres modos de permiso</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
          <div style="display:flex;gap:12px;align-items:flex-start;background:rgba(120,140,93,0.07);border:1.5px solid rgba(120,140,93,0.3);border-radius:9px;padding:12px 14px;">
            <span style="flex:0 0 auto;background:#788c5d;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;padding:4px 0;border-radius:6px;width:92px;text-align:center;">Manual ★</span>
            <div style="flex:1;"><div style="font-size:12.5px;color:#141413;line-height:1.6;">Frena y pide permiso en cada acción.</div><div style="font-size:11.5px;color:#877f74;margin-top:2px;"><strong style="color:#5a6b45;">Para empezar, y siempre que toque algo que importe.</strong></div></div>
          </div>
          <div style="display:flex;gap:12px;align-items:flex-start;background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:12px 14px;">
            <span style="flex:0 0 auto;background:rgba(106,155,204,0.16);color:#3d6690;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;padding:4px 0;border-radius:6px;width:92px;text-align:center;">Auto</span>
            <div style="flex:1;"><div style="font-size:12.5px;color:#141413;line-height:1.6;">Sigue sin preguntar, pero revisa cada acción por seguridad y bloquea lo que considera riesgoso.</div><div style="font-size:11.5px;color:#877f74;margin-top:2px;">Tareas largas de bajo riesgo. <strong style="color:#a8532f;">Ojo: consume más cupo que los otros modos</strong>, porque hace esa revisión extra.</div></div>
          </div>
          <div style="display:flex;gap:12px;align-items:flex-start;background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:12px 14px;">
            <span style="flex:0 0 auto;background:#a8532f;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;padding:4px 0;border-radius:6px;width:92px;text-align:center;">Skip</span>
            <div style="flex:1;"><div style="font-size:12.5px;color:#141413;line-height:1.6;">No pregunta y no revisa nada.</div><div style="font-size:11.5px;color:#877f74;margin-top:2px;">Solo si confiás por completo en cada archivo, conector y sitio involucrado.</div></div>
          </div>
        </div>
        <div style="background:#fff8e1;border-left:4px solid #d97757;border-radius:0 10px 10px 0;padding:13px 17px;margin-bottom:24px;font-size:12.5px;color:#5d4037;line-height:1.7;">⚠️ Para trabajo con consecuencias reales —plata, mensajes enviados a tu nombre, archivos importantes— conviene <strong style="color:#a8532f;">quedarse cerca y revisar, o volver al modo Manual</strong>. Ningún modo reemplaza el criterio propio.</div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Qué sabe hacer que Chat no</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:22px;">
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 15px;">
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#5a6b45;margin-bottom:5px;">📂 Lee y escribe tus archivos</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Trabaja directo sobre los archivos locales, sin subir ni bajar nada a mano. <em>Ej: toma el export de liquidación de la carpeta del mes y devuelve el control armado.</em></div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 15px;">
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#5a6b45;margin-bottom:5px;">📊 Entregables de verdad</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Excel con fórmulas que funcionan (VLOOKUP, formato condicional, varias solapas), PowerPoint y documentos formateados — no un CSV que después hay que arreglar. <em>Ej: la plantilla de control del recálculo por cliente y fase.</em></div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 15px;">
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#5a6b45;margin-bottom:5px;">⏱️ Tareas largas</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Sostiene el trabajo sin cortarse por límite de conversación. <em>Ej: revisar los 12 meses de un cliente de una sola pasada.</em></div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 15px;">
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#5a6b45;margin-bottom:5px;">🗓️ Tareas programadas</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Con <code style="background:#e8e6dc;padding:1px 5px;border-radius:4px;font-size:11.5px;">/schedule</code> dejás una tarea corriendo con la frecuencia que quieras. Corren en la nube, sin necesidad de que la computadora esté prendida. <em>Ej: el control de novedades el primer día hábil de cada mes.</em></div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 15px;">
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#5a6b45;margin-bottom:5px;">🧩 Sub-agentes y proyectos</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Parte el trabajo grande en pedazos que corren a la vez, y agrupa tareas relacionadas en <strong style="color:#141413;">proyectos</strong> con sus propios archivos, instrucciones y memoria.</div>
          </div>
        </div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Límites que conviene saber de entrada</div>
        <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:14px 18px;margin-bottom:22px;">
          <div style="display:flex;flex-direction:column;gap:7px;">
            <div style="display:flex;gap:9px;font-size:12.5px;line-height:1.6;"><span style="flex-shrink:0;color:#a8532f;">•</span><span style="color:#141413;"><strong style="color:#141413;">Consume bastante más cupo que Chat.</strong> Es la contra principal: para algo simple, Chat.</span></div>
            <div style="display:flex;gap:9px;font-size:12.5px;line-height:1.6;"><span style="flex-shrink:0;color:#a8532f;">•</span><span style="color:#141413;">La <strong style="color:#141413;">memoria del chat no pasa a Cowork</strong>. Dentro de Cowork hay memoria solo en proyectos.</span></div>
            <div style="display:flex;gap:9px;font-size:12.5px;line-height:1.6;"><span style="flex-shrink:0;color:#a8532f;">•</span><span style="color:#141413;"><strong style="color:#141413;">No se pueden compartir sesiones.</strong> En Team sí se pueden compartir <em>live artifacts</em> dentro de la organización.</span></div>
            <div style="display:flex;gap:9px;font-size:12.5px;line-height:1.6;"><span style="flex-shrink:0;color:#a8532f;">•</span><span style="color:#141413;">Algunas cosas son <strong style="color:#141413;">solo de escritorio</strong> (live artifacts, plugins con MCP local).</span></div>
            <div style="display:flex;gap:9px;font-size:12.5px;line-height:1.6;"><span style="flex-shrink:0;color:#5a6b45;">•</span><span style="color:#141413;">Antes de borrar un archivo de forma permanente, <strong style="color:#141413;">siempre pide permiso explícito</strong>.</span></div>
          </div>
        </div>

        <div style="background:#fdf1ec;border-left:3px solid #d97757;border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:22px;font-size:12.5px;color:#141413;line-height:1.7;"><strong style="color:#a8532f;">Nota para el equipo:</strong> desde el <strong style="color:#141413;">3 de agosto de 2026</strong> Cowork entra en beta en web y mobile para planes Team. En web y mobile las sesiones corren en la nube de Anthropic.</div>

        <details style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:14px 18px;">
          <summary style="cursor:pointer;font-family:'Poppins',Arial,sans-serif;font-size:11.5px;font-weight:700;color:#726c62;">🔧 Para administradores — controles de la organización (Primary Owner)</summary>
          <div style="display:flex;flex-direction:column;gap:7px;margin-top:12px;">
            <div style="display:flex;gap:9px;font-size:12px;line-height:1.6;"><span style="flex-shrink:0;color:#877f74;">•</span><span style="color:#141413;">Cowork viene <strong style="color:#141413;">activado por defecto</strong> en Team. Se apaga desde <em>Organization settings &gt; Cowork</em>.</span></div>
            <div style="display:flex;gap:9px;font-size:12px;line-height:1.6;"><span style="flex-shrink:0;color:#877f74;">•</span><span style="color:#141413;"><strong style="color:#141413;">"Run Cowork in the cloud"</strong>: en Team viene activado por defecto; un owner lo puede apagar. (En Enterprise viene apagado — no es nuestro caso.)</span></div>
            <div style="display:flex;gap:9px;font-size:12px;line-height:1.6;"><span style="flex-shrink:0;color:#877f74;">•</span><span style="color:#141413;"><strong style="color:#141413;">"Allow 'Always allow' for connector tools"</strong>: viene apagado por defecto. Con eso apagado, cada tarea pide aprobación para las herramientas de conectores que escriben.</span></div>
            <div style="display:flex;gap:9px;font-size:12px;line-height:1.6;"><span style="flex-shrink:0;color:#877f74;">•</span><span style="color:#141413;">El toggle de Cowork es <strong style="color:#141413;">todo o nada</strong> en Team: no hay control por persona ni por equipo, eso es de Enterprise.</span></div>
            <div style="display:flex;gap:9px;font-size:12px;line-height:1.6;"><span style="flex-shrink:0;color:#877f74;">•</span><span style="color:#141413;">Se puede apagar la búsqueda web para Cowork y Chat en <em>Organization settings &gt; Capabilities</em>.</span></div>
            <div style="display:flex;gap:9px;font-size:12px;line-height:1.6;"><span style="flex-shrink:0;color:#877f74;">•</span><span style="color:#141413;">Se puede monitorear la actividad con OpenTelemetry.</span></div>
          </div>
          <div style="background:#faf9f5;border:1px dashed #cfc9bd;border-radius:8px;padding:9px 12px;margin-top:10px;font-size:11px;color:#877f74;line-height:1.6;">Las sesiones <strong style="color:#726c62;">locales</strong> guardan el historial en la computadora del usuario: quedan fuera de las políticas de retención estándar y un admin no las puede administrar ni exportar de forma centralizada. En sesiones en la nube, la sesión y los archivos quedan guardados en la cuenta Claude del usuario.</div>
        </details>
          </div>
        </sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ secCode.visible }}">
      <div id="sec-code" style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;margin-bottom:9px;">
        <button onClick="{{ secCode.toggle }}" style="width:100%;background:{{ secCode.headBg }};border:none;border-radius:12px;padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;">
          <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-size:15px;">🤖</span>
            <span style="font-family:'Poppins',Arial,sans-serif;font-size:13.5px;font-weight:600;color:#141413;">Claude Code — para quien edita el portal</span>
            <span style="font-size:11.5px;color:#877f74;">primeros pasos, modelos, Ultracode</span>
          </span>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:15px;color:#a8532f;flex-shrink:0;">{{ secCode.chev }}</span>
        </button>
        <sc-if value="{{ secCode.open }}">
          <div style="padding:4px 18px 18px;">
        <div style="background:#e8e6dc;border-radius:8px;padding:11px 15px;font-size:12.5px;color:#726c62;margin-bottom:16px;line-height:1.6;"><strong style="color:#141413;">Esta sección es para quien mantiene o edita el código de este portal</strong> (IT / desarrollo). Si solo necesitás usar Claude para tu trabajo diario, quedate en "Por tarea" o "Por visualización".</div>

        <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:16px 18px;margin-bottom:22px;">
          <p style="font-size:13px;color:#141413;line-height:1.75;"><strong style="color:#141413;">Claude Code</strong> es la versión de Claude para trabajar directamente sobre este repositorio de GitHub: lee y edita los archivos HTML del portal (como esta misma guía, el Gestor de Novedades o el análisis de IG anual), ejecuta comandos, prueba los cambios y prepara los commits. No es un chat aparte — trabaja sobre el código real que después queda publicado.</p>
          <p style="font-size:13px;color:#141413;line-height:1.75;margin-top:8px;">La diferencia con usar Claude por chat normal es que <strong style="color:#141413;">Claude Code ve todo el repositorio</strong>: puede abrir varios archivos a la vez, mantener el mismo estilo visual entre páginas y correr el resultado antes de mostrártelo. Sirve tanto para pedirle una página nueva como para mantener las que ya existen.</p>
        </div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Primeros pasos en la app de escritorio (para quien nunca lo usó)</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">1</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Abrí la app de escritorio de Claude</strong> y andá a la pestaña <strong style="color:#141413;">Code</strong> (arriba, al centro). Si pide upgrade de plan, avisale a IT — con el plan Teams de H&amp;A ya debería estar habilitado.</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">2</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Elegí el entorno.</strong> Para trabajar sobre tus propios archivos elegí <strong style="color:#141413;">Local</strong>. En Windows hace falta tener Git instalado para que funcione; en Mac ya viene instalado.</div>
          </div>
          <div style="display:flex;gap:12px;background:#fdf1ec;border:1.5px solid rgba(217,119,87,0.3);border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#d97757;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">3</div>
            <div style="padding-top:2px;">
              <div style="font-size:12.5px;color:#141413;line-height:1.65;"><strong style="color:#141413;">Seleccioná la carpeta del proyecto</strong> con "Select folder". Clave para entender: <strong style="color:#a8532f;">Claude Code solo ve y puede modificar lo que está dentro de esa carpeta</strong> — no accede a nada afuera. Por eso conviene:</div>
              <div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;">
                <div style="display:flex;gap:8px;font-size:12px;color:#141413;line-height:1.55;"><span style="color:#d97757;flex-shrink:0;">📁</span><span>Tener <strong style="color:#141413;">una carpeta por proyecto</strong> (una para el repo de la guía de Payroll, otra para el Validador de Novedades), no todo mezclado.</span></div>
                <div style="display:flex;gap:8px;font-size:12px;color:#141413;line-height:1.55;"><span style="color:#d97757;flex-shrink:0;">📁</span><span>Elegir la <strong style="color:#141413;">carpeta raíz del repositorio</strong> clonado de GitHub, no una subcarpeta suelta, así Claude ve todos los archivos relacionados (HTML, imágenes, etc.).</span></div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">4</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Elegí el modelo</strong> en el desplegable junto al botón de enviar (ver "Qué modelo usar en Claude Code" más abajo).</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">5</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Escribí el pedido</strong> en el chat, igual que en Claude normal (ej: "agregá una tarjeta nueva en la sección Por visualización explicando Claude Design").</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">6</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Revisá los cambios antes de aceptarlos.</strong> Cuando Claude edita un archivo aparece un indicador tipo <code style="background:#e8e6dc;padding:1px 5px;border-radius:4px;font-size:11.5px;">+12 −1</code>. Hacé clic para ver el diff línea por línea y comentar si algo no está bien — Claude ajusta con tu comentario.</div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">7</div>
            <div style="padding-top:2px;">
              <div style="font-size:12.5px;color:#141413;line-height:1.65;"><strong style="color:#141413;">Elegí cuánto control querés tener</strong> (modo de permisos):</div>
              <div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;">
                <div style="font-size:12px;color:#141413;line-height:1.55;"><strong style="color:#5a6b45;">Ask permissions</strong> (default): aprobás cada cambio antes de que se aplique. <strong style="color:#141413;">Recomendado para principiantes.</strong></div>
                <div style="font-size:12px;color:#141413;line-height:1.55;"><strong style="color:#3d6690;">Auto accept edits</strong>: más rápido, pero Claude aplica los cambios sin pedir aprobación previa.</div>
                <div style="font-size:12px;color:#141413;line-height:1.55;"><strong style="color:#141413;">Plan mode</strong>: Claude arma un plan sin tocar ningún archivo todavía — útil antes de un cambio grande.</div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:12px;background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:13px 16px;align-items:flex-start;">
            <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#141413;color:#fff;font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;">8</div>
            <div style="font-size:12.5px;color:#141413;line-height:1.65;padding-top:2px;"><strong style="color:#141413;">Previsualizá el resultado</strong> con el botón "Preview" antes de dar por terminado el cambio, si es una página HTML.</div>
          </div>
        </div>

        <div style="background:#fff8e1;border-left:4px solid #d97757;border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:26px;">
          <div style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;color:#a8532f;margin-bottom:6px;display:flex;align-items:center;gap:7px;">⚠️ Antes de publicar para que otros lo vean</div>
          <div style="font-size:12.5px;color:#141413;line-height:1.7;">Claude Code puede preparar el commit e incluso abrir un pull request en GitHub, pero <strong style="color:#141413;">la publicación final la maneja {{ reviewerName }}</strong>. Si terminaste un cambio y necesitás que quede visible para el resto del equipo (por ejemplo, que se actualice la guía compartida), <strong style="color:#a8532f;">no lo subas directo</strong> — avisale a <strong style="color:#141413;">{{ reviewerName }}</strong> con un resumen breve de qué cambiaste y por qué, para que lo revise y lo suba a GitHub. Esto evita que cambios sin revisar queden publicados por error.</div>
        </div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Qué modelo usar en Claude Code</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;">
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;margin-bottom:10px;border-bottom:2px solid #6a9bcc;">
              <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:600;color:#6a9bcc;">Haiku 4.5</span>
              <span style="font-size:10px;font-weight:600;color:#b0aea5;">Cupo: bajo</span>
            </div>
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#a8532f;margin-bottom:6px;">Subagentes rápidos</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Claude Code lo usa por detrás para tareas chicas y en paralelo — buscar dónde está definida una función, listar archivos, chequeos simples. No conviene pedirlo como modelo principal para escribir código de producción.</div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;margin-bottom:10px;border-bottom:2px solid #788c5d;">
              <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:600;color:#788c5d;">Sonnet 5</span>
              <span style="font-size:10px;font-weight:600;color:#b0aea5;">Cupo: medio</span>
            </div>
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#a8532f;margin-bottom:6px;">Default para programar</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">El que usás para el día a día: agregar un campo al recibo, corregir un bug puntual, ajustar estilos de una página existente. Casi el nivel de Opus en tareas de código a un costo mucho menor — arrancá siempre por acá.</div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;margin-bottom:10px;border-bottom:2px solid #141413;">
              <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:600;color:#141413;display:flex;align-items:center;gap:6px;">Opus 5<span style="background:#d97757;color:#fff;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:2px 6px;border-radius:20px;">Nuevo</span></span>
              <span style="font-size:10px;font-weight:600;color:#b0aea5;">Cupo: alto</span>
            </div>
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#a8532f;margin-bottom:6px;">Cambios grandes o riesgosos</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Para refactors que tocan varios archivos, lógica de cálculo compleja (SAC, retenciones, recálculos) o cuando necesitás que verifique su propio trabajo antes de entregar. Más lento y consume más cupo que Sonnet, pero es más confiable en tareas largas. <strong style="color:#141413;">Opus 5 salió al mismo precio que el escalón anterior y rinde bastante más; seguí arrancando por Sonnet.</strong></div>
          </div>
          <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:10px;padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;margin-bottom:10px;border-bottom:2px solid #8a6a9c;">
              <span style="font-family:'Poppins',Arial,sans-serif;font-size:14px;font-weight:600;color:#6d4a7d;">Fable 5</span>
              <span style="font-size:10px;font-weight:600;color:#b0aea5;">Cupo: muy alto</span>
            </div>
            <div style="font-family:'Poppins',Arial,sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#a8532f;margin-bottom:6px;">Último recurso</div>
            <div style="font-size:12px;color:#141413;line-height:1.65;">Pensado para tareas de código de máxima complejidad y largo aliento — migrar todo un sistema, auditar el repositorio completo o trabajar de forma autónoma por varios minutos sin supervisión. Es el que más cupo consume: usalo solo cuando Opus no alcanza, y avisando antes. <strong style="color:#141413;">Con la salida de Opus 5 ese margen se volvió muy chico</strong> — ver el detalle abajo.</div>
          </div>
        </div>

        <div style="border:1.5px solid rgba(217,119,87,0.4);border-radius:12px;overflow:hidden;margin-bottom:26px;background:#ffffff;">
          <div style="background:#fdf1ec;padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:700;color:#a8532f;display:flex;align-items:center;gap:7px;"><span style="font-size:15px;">✨</span>Novedad · Claude Opus 5</span>
            <span style="background:#ffffff;border:1px solid rgba(217,119,87,0.35);color:#a8532f;font-family:'Poppins',Arial,sans-serif;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:3px 9px;border-radius:20px;">24 jul 2026</span>
            <span style="background:#ffffff;border:1px solid #cfc9bd;color:#726c62;font-family:'Poppins',Arial,sans-serif;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:3px 9px;border-radius:20px;">Nuevo escalón Opus</span>
          </div>
          <div style="padding:18px;">
            <p style="font-size:13px;color:#141413;line-height:1.75;margin-bottom:16px;max-width:840px;">Anthropic lanzó <strong style="color:#141413;">Claude Opus 5</strong> el 24 de julio de 2026 y reemplazó al escalón Opus anterior. La idea central: entrega <strong style="color:#141413;">casi toda la capacidad de Fable 5 consumiendo bastante menos cupo</strong>, sin subir de precio de lista respecto del escalón que reemplaza. Para el equipo eso significa que <strong style="color:#141413;">el escalón "Opus" mejoró mucho sin salir más caro</strong>, y que las razones para llegar hasta Fable 5 se reducen bastante. <strong style="color:#141413;">Seguí arrancando por Sonnet.</strong></p>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px;">
              <div style="background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:13px 14px;">
                <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#a8532f;margin-bottom:5px;">🎯 Casi al nivel de Fable 5</div>
                <div style="font-size:12px;color:#141413;line-height:1.6;">Con esfuerzo máximo queda muy cerca del mejor resultado de Fable 5 en tareas de código, consumiendo bastante menos cupo por tarea. Ese margen chico es la razón para casi no llegar a Fable.</div>
              </div>
              <div style="background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:13px 14px;">
                <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#a8532f;margin-bottom:5px;">📈 Mismo cupo, más capacidad</div>
                <div style="font-size:12px;color:#141413;line-height:1.6;">Donde antes escalabas al escalón Opus anterior, ahora tenés Opus 5 con el mismo consumo de cupo y bastante más capacidad. No hay que rehacer ningún cálculo del equipo.</div>
              </div>
              <div style="background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:13px 14px;">
                <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#a8532f;margin-bottom:5px;">⚡ Modo rápido (Fast mode)</div>
                <div style="font-size:12px;color:#141413;line-height:1.6;">Existe una variante que corre a <strong style="color:#141413;">~2,5× la velocidad normal</strong> consumiendo el doble de cupo. Útil cuando la demora molesta más que el cupo; no es el modo por defecto.</div>
              </div>
              <div style="background:#faf9f5;border:1px solid #e8e6dc;border-radius:9px;padding:13px 14px;">
                <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#a8532f;margin-bottom:5px;">🔑 Dónde está disponible</div>
                <div style="font-size:12px;color:#141413;line-height:1.6;">En todas las plataformas de Anthropic desde el día del lanzamiento. Es el <strong style="color:#141413;">modelo por defecto del plan Claude Max</strong> y el más capaz disponible en Claude Pro.</div>
              </div>
            </div>

            <div style="background:rgba(120,140,93,0.08);border:1px solid rgba(120,140,93,0.3);border-radius:9px;padding:13px 15px;margin-bottom:12px;">
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#5a6b45;margin-bottom:5px;">✅ Qué cambia en la práctica para Payroll</div>
              <div style="font-size:12.5px;color:#141413;line-height:1.7;">La regla de arranque no cambia: <strong style="color:#141413;">seguí empezando por Sonnet 5</strong> para el trabajo del día a día. Lo que cambió es el escalón de arriba: cuando antes escalabas al Opus anterior, ahora tenés Opus 5 con el mismo consumo de cupo y más capacidad — así que <strong style="color:#141413;">conviene escalar a Opus antes que antes</strong> ante un refactor grande o un cálculo riesgoso. Y salvo casos muy puntuales (auditoría multi-año, implicancia legal fuerte), <strong style="color:#141413;">ya casi no hace falta llegar hasta Fable 5</strong>.</div>
            </div>

            <div style="background:#fff8e1;border:1px solid rgba(217,119,87,0.3);border-radius:8px;padding:11px 14px;font-size:11.5px;color:#5d4037;line-height:1.65;">📌 Los números de confianza de la pestaña "Por tarea" siguen siendo estimaciones internas del equipo tomadas del escalón Opus anterior. Con Opus 5 el resultado real debería ser igual o mejor en cada caso — conviene revalidarlos con casos propios en las próximas semanas.</div>
          </div>
        </div>

        <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;padding:20px 24px 14px;margin-bottom:26px;">
          <div style="font-size:11px;color:#b0aea5;margin-bottom:14px;font-family:'Poppins',Arial,sans-serif;text-transform:uppercase;letter-spacing:0.6px;">Consumo de cupo relativo por modelo — el mismo salto de nivel que en "Por tarea"</div>
          <div style="display:flex;align-items:flex-end;gap:2px;height:120px;">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:700;color:#6a9bcc;margin-bottom:6px;">Bajo</div>
              <div style="width:100%;max-width:60px;border-radius:8px 8px 0 0;background:#6a9bcc;height:10%;min-height:4px;"></div>
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:600;color:#6a9bcc;margin-top:8px;">Haiku 4.5</div>
            </div>
            <div style="flex:0 0 46px;display:flex;align-items:center;justify-content:center;height:100%;padding-bottom:26px;"><div style="background:#fdf1ec;border:1px solid rgba(217,119,87,0.3);border-radius:20px;padding:3px 8px;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#a8532f;">3x</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:700;color:#788c5d;margin-bottom:6px;">Medio</div>
              <div style="width:100%;max-width:60px;border-radius:8px 8px 0 0;background:#788c5d;height:30%;min-height:4px;"></div>
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:600;color:#788c5d;margin-top:8px;">Sonnet 5</div>
            </div>
            <div style="flex:0 0 46px;display:flex;align-items:center;justify-content:center;height:100%;padding-bottom:26px;"><div style="background:#f2f0ea;border:1px solid #cfc9bd;border-radius:20px;padding:3px 8px;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#141413;">1.7x</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:700;color:#141413;margin-bottom:6px;">Alto</div>

              <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:600;color:#141413;margin-top:8px;">Opus 5</div>
            </div>
            <div style="flex:0 0 46px;display:flex;align-items:center;justify-content:center;height:100%;padding-bottom:26px;"><div style="background:#f2f0ea;border:1px solid #cfc9bd;border-radius:20px;padding:3px 8px;font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;color:#726c62;">2x</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:13px;font-weight:700;color:#6d4a7d;margin-bottom:6px;">Muy alto</div>
              <div style="width:100%;max-width:60px;border-radius:8px 8px 0 0;background:#8a6a9c;height:100%;min-height:4px;"></div>
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:600;color:#6d4a7d;margin-top:8px;">Fable 5</div>
            </div>
          </div>
        </div>

        <div style="font-family:'Poppins',Arial,sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.9px;color:#b0aea5;margin-bottom:10px;">Razonamiento extendido y niveles de esfuerzo</div>
        <div style="background:#ffffff;border:1.5px solid #e8e6dc;border-radius:12px;padding:16px 20px;margin-bottom:26px;">
          <div style="font-size:12.5px;color:#141413;line-height:1.7;max-width:840px;">Thinking y esfuerzo son <strong style="color:#141413;">dos configuraciones separadas que se pueden combinar</strong>, disponibles tanto en el chat como en Claude Code y en Claude Design. El criterio de cuándo usar cada cosa <strong style="color:#141413;">pasó a la pestaña "Por tarea"</strong>, que es donde lo necesita todo el equipo — ahí está la regla corta y, desplegable, la tabla con los cinco niveles.</div>
        </div>


        <div style="background:rgba(106,155,204,0.08);border:1.5px solid rgba(106,155,204,0.28);border-radius:12px;padding:20px 24px;margin-bottom:26px;">
          <div style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#3d6690;margin-bottom:10px;display:flex;align-items:center;gap:7px;">🧩 Ultracode — no es un modelo, es un modo</div>
          <div style="font-size:13px;color:#141413;line-height:1.75;margin-bottom:16px;max-width:820px;">Ultracode se activa sobre Sonnet 5, Opus 5 o Fable 5 — no es una quinta opción de modelo. Reparte una tarea grande entre varios agentes que trabajan al mismo tiempo (uno busca bugs de cálculo, otro revisa consistencia de estilos entre archivos, otro verifica seguridad) y después cruza los resultados entre sí antes de mostrarte una conclusión. Es más lento que un pedido normal, pero mucho más exhaustivo.</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:14px;">
            <div>
              <div style="font-family:'Poppins',Arial,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;color:#5a6b45;">Conviene usarlo cuando</div>
              <ul style="list-style:none;display:flex;flex-direction:column;gap:7px;padding:0;margin:0;">

            <p style="font-size:13px;color:#141413;line-height:1.75;margin-bottom:16px;max-width:840px;"><strong style="color:#141413;">Claude Design</strong> es el producto de Anthropic Labs para generar prototipos visuales, presentaciones, one-pagers y mockups conversando con Claude (estado verificado el 27 de julio de 2026). A diferencia de un artifact suelto, es un espacio de diseño completo: iterás la parte visual en lenguaje natural y después la exportás o se la pasás a Claude Code para el HTML final.</p>

function splitLede(text){
  var idx = text.indexOf('. ');
  if (idx === -1) return { lede: text, rest: '' };
  return { lede: text.slice(0, idx + 1), rest: text.slice(idx + 2) };
}

function buildVerdictParts(text){
  var re = /(Haiku 4\.5|Sonnet 5|Opus 5|Fable 5)/g;
  var parts = [];
  var last = 0, m;
  var keyFor = function(label){
    if (label.indexOf('Haiku') === 0) return 'haiku';
    if (label.indexOf('Sonnet') === 0) return 'sonnet';
    if (label.indexOf('Opus') === 0) return 'opus';
    return 'fable';
  };
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ text: text.slice(last, m.index), isModel: false, isText: true });
    var key = keyFor(m[1]);
    parts.push({ text: m[1], isModel: true, isText: false, color: MODEL_COLORS[key], colorBg: MODEL_COLORS[key] + '1A' });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ text: text.slice(last), isModel: false, isText: true });
  return parts;
}

function buildCase(key){
  var raw = CASES_RAW[key];
  var models = {};
  ['haiku','sonnet','opus','fable'].forEach(function(m){
    var q = raw[m];
    var s = splitLede(q.quality);
    models[m] = { tokens: q.tokens, time: q.time, iter: q.iter, conf: q.conf, lede: s.lede, rest: s.rest, name: MODEL_NAMES[m], color: MODEL_COLORS[m] };
  });

  // Escalera confianza-vs-costo: una fila por modelo, con el delta de confianza y el múltiplo de costo respecto del nivel anterior.
  var rungs = LADDER_META.map(function(meta, i){
    var conf = models[meta.key].conf;
    var rung = {
      name: meta.name, role: meta.role, color: meta.color, conf: conf, confPct: conf,
      costLabel: meta.costLabel, costPct: meta.costPct, costMult: meta.mult,
      isSweet: !!meta.sweet, hasDelta: i > 0, deltaBig: false, deltaSmall: false, deltaConf: '', deltaNote: ''
    };
    if (i > 0){
      var prevConf = models[LADDER_META[i-1].key].conf;
      var d = conf - prevConf;
      rung.deltaConf = (d >= 0 ? '+' : '') + d + ' pts';
      if (i === 1){ rung.deltaBig = true; rung.deltaNote = 'el mayor salto — casi toda la calidad por una fracción del cupo tope'; }
      else { rung.deltaSmall = true; }
    }
    return rung;
  });

  var sign = function(n){ return (n >= 0 ? '+' : '') + n; };
  return {
    key: key, title: raw.title, desc: raw.desc,
    verdict: raw.verdict, verdictParts: buildVerdictParts(raw.verdict),
    haiku: models.haiku, sonnet: models.sonnet, opus: models.opus, fable: models.fable,
    rungs: rungs,
    deltaSonnet: sign(models.sonnet.conf - models.haiku.conf),
    deltaOpus: sign(models.opus.conf - models.sonnet.conf),
    deltaFable: sign(models.fable.conf - models.opus.conf)
  };
}

  }

  var SEARCH_INDEX = [];
  CASE_ORDER.forEach(function(k){
    SEARCH_INDEX.push({
      kind:'tarea', label: CASE_LABELS[k].replace(/^\S+\s/,''), hint:'ver la respuesta',
      text: norm(CASE_LABELS[k] + ' ' + CASES[k].title + ' ' + CASES[k].desc + ' ' + CASES[k].verdict),
      go: function(){ state.currentCase = k; state.tool = null; }
    });
  });
  CONCEPTS.forEach(function(c){
    SEARCH_INDEX.push({
      kind:'dato', label: c.label, hint: SECTION_LABELS[c.section],
      text: norm(c.label + ' ' + c.kw + ' ' + SECTION_LABELS[c.section]),
      go: function(){ state.open[c.section] = true; }, scrollTo: c.section
    });
  });
  SECTION_IDS.forEach(function(id){
    SEARCH_INDEX.push({
      kind:'sección', label: SECTION_LABELS[id], hint:'abrir la sección',
      text: norm(SECTION_LABELS[id]),
      go: function(){ state.open[id] = true; }, scrollTo: id
    });
  });

  function scrollToSection(id){
    setTimeout(function(){
      var el = document.getElementById('sec-' + id);
      if (el){
        var y = el.getBoundingClientRect().top + window.scrollY - 20;
        window.scrollTo(0, Math.max(y, 0));
      }
    }, 60);
  }

  function buildSearch(){
    var q = norm(state.query).trim();
    var results = [];
    if (q.length >= 2){
      var terms = q.split(/\s+/);
      SEARCH_INDEX.forEach(function(item){
        var ok = true;
        terms.forEach(function(t){ if (item.text.indexOf(t) === -1) ok = false; });
        if (ok) results.push(item);
      });
      results = results.slice(0, 8);
    }
    var KIND_STYLE = {
      'tarea':   {bg:'rgba(120,140,93,0.16)',  color:'#5a6b45'},
      'dato':    {bg:'rgba(106,155,204,0.16)', color:'#3d6690'},
      'sección': {bg:'#f2f0ea',           color:'#726c62'}
    };
    return {
      query: state.query,
      hasQuery: state.query.trim().length > 0,
      hasResults: results.length > 0,
      noResults: state.query.trim().length >= 2 && results.length === 0,
      onInput: function(e){ state.query = e.target.value; state.searchFocus = true; rerender(); },
      clear: function(){ state.query = ''; state.searchFocus = false; rerender(); },
      results: results.map(function(item){
        var st = KIND_STYLE[item.kind];
        return {
          kind: item.kind, label: item.label, hint: item.hint,
          kindBg: st.bg, kindColor: st.color,
          onClick: function(){
            item.go();
            state.query = '';
            state.searchFocus = false;
            rerender();
            if (item.scrollTo) scrollToSection(item.scrollTo);
          }
        };
      })
    };
  }

  function buildSections(){
    var q = norm(state.query).trim();
    var out = {};
    SECTION_IDS.forEach(function(id){
      var isOpen = !!state.open[id];
      var visible = true;
      if (q.length >= 2){
        // con busqueda activa, la lista de secciones se filtra por coincidencia
        var hay = norm(SECTION_LABELS[id]).indexOf(q) !== -1;
        var concept = false;
        CONCEPTS.forEach(function(c){
          if (c.section === id && norm(c.label + ' ' + c.kw).indexOf(q) !== -1) concept = true;
        });
        visible = hay || concept;
      }
      out['sec' + id.charAt(0).toUpperCase() + id.slice(1)] = {
        open: isOpen, visible: visible, chev: isOpen ? '–' : '+',
        headBg: isOpen ? '#faf9f5' : '#ffffff',
        toggle: function(){ state.open[id] = !state.open[id]; rerender(); }
      };
    });
    return out;
  }

  function buildAnswer(){
    var key = state.currentCase;
    var a = ANSWER_BY_CASE[key];
    var toolKey = state.tool || a.tool;
    var tool = TOOL_BY_KEY[toolKey];
    var st = MODEL_STYLE[a.model];
    return {
      caseTitle: CASES[key].title,
      model: MODEL_NAMES[a.model],
      modelBg: st.bg, modelColor: st.color,
      thinking: a.thinking,
      effort: a.effort,
      cupo: CUPO_BY_MODEL[a.model],
      tool: tool.name,
      toolAlt: state.tool ? ('Elegiste ' + tool.name + ': ' + tool.one + ' La sugerida para esta tarea es ' + TOOL_BY_KEY[a.tool].name + '.') : a.alt,
      escalate: a.escalate,
      folderWarning: toolKey === 'cowork',
      openWhy: function(){ state.open.why = true; rerender(); scrollToSection('why'); },
      openToolSection: function(){ state.open[tool.section] = true; rerender(); scrollToSection(tool.section); }
    };
  }

  function renderVals(){
    var currentCase = state.currentCase;
    var caseChips = CASE_ORDER.map(function(k){
      var active = k === currentCase;
      return {
        label: CASE_LABELS[k],
        bg: active ? 'rgba(120,140,93,0.14)' : '#ffffff',
        border: active ? 'rgba(120,140,93,0.5)' : '#e8e6dc',
        color: active ? '#3f4a30' : '#726c62',
        weight: active ? 700 : 500,
        onClick: function(){ state.currentCase = k; state.tool = null; rerender(); }
      };
    });
    var suggestedTool = ANSWER_BY_CASE[currentCase].tool;
    var toolTiles = TOOLS.map(function(t){
      var active = (state.tool || suggestedTool) === t.key;
      return {
        icon: t.icon, name: t.name, one: t.one, color: t.color,
        suggested: t.key === suggestedTool,
        bg: active ? '#ffffff' : '#faf9f5',
        border: active ? 'rgba(120,140,93,0.5)' : '#e8e6dc',
        onClick: function(){ state.tool = (state.tool === t.key ? null : t.key); rerender(); }
      };
    });
    var vals = {
      caseChips: caseChips,
      toolTiles: toolTiles,
      search: buildSearch(),
      answer: buildAnswer(),
      selectedCase: CASES[currentCase],
      categories: CATEGORIES,
      reviewerName: props.reviewerName,
      showLadder: props.showLadder,
      showFullQuality: props.showFullQuality
    };
    var secs = buildSections();
    for (var k in secs) vals[k] = secs[k];
    return vals;
  }


  /* ============================================================
     Mini-motor de plantillas: interpreta <sc-if>, <sc-for>,
     {{ ruta }} y onClick="{{ handler }}" (el mismo DSL que usaba
     el runtime del host, resuelto acá con JS vanilla).
     ============================================================ */
  function unwrap(expr){ return expr.replace(/^\s*\{\{/, '').replace(/\}\}\s*$/, '').trim(); }

  function lookup(scope, path){
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    var parts = path.split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++){
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }

  function interp(str, scope){
    return str.replace(/\{\{([^}]+)\}\}/g, function(_, e){
      var v = lookup(scope, e);
      return v == null ? '' : String(v);
    });
  }

  function processInto(node, scope, target){
    if (node.nodeType === 3){ // texto
      target.push(document.createTextNode(interp(node.nodeValue, scope)));
      return;
    }
    if (node.nodeType !== 1) return; // comentarios u otros

    var tag = node.tagName.toLowerCase();

    if (tag === 'sc-if'){
      if (lookup(scope, unwrap(node.getAttribute('value') || ''))){
        processChildren(node, scope, target);
      }
      return;
    }

    if (tag === 'sc-for'){
      var list = lookup(scope, unwrap(node.getAttribute('list') || '')) || [];
      var asName = node.getAttribute('as');
      for (var i = 0; i < list.length; i++){
        var child = Object.create(scope);
        child[asName] = list[i];
        processChildren(node, child, target);
      }
      return;
    }

    // elemento normal
    var el = document.createElement(node.tagName);
    var attrs = node.attributes;
    for (var a = 0; a < attrs.length; a++){
      var at = attrs[a];
      if (at.name === 'onclick'){
        var fn = lookup(scope, unwrap(at.value));
        if (typeof fn === 'function') el.addEventListener('click', fn);
        continue;
      }
      if (at.name === 'oninput'){
        var fnIn = lookup(scope, unwrap(at.value));
        if (typeof fnIn === 'function') el.addEventListener('input', fnIn);
        continue;
      }
      el.setAttribute(at.name, interp(at.value, scope));
      // el buscador es un input controlado: setAttribute no alcanza para el valor vivo
      if (at.name === 'value' && tag === 'input') el.value = interp(at.value, scope);
    }
    var kids = [];
    processChildren(node, scope, kids);
    for (var k = 0; k < kids.length; k++) el.appendChild(kids[k]);
    target.push(el);
  }

  function processChildren(node, scope, target){
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) processInto(kids[i], scope, target);
  }

  var tpl = document.getElementById('tpl');
  var mount = document.getElementById('app');

  function rerender(){
    var scope = renderVals();
    var target = [];
    processChildren(tpl.content, scope, target);
    mount.textContent = '';
    for (var i = 0; i < target.length; i++) mount.appendChild(target[i]);
    // el rerender recrea el DOM: si el usuario estaba tipeando, le devolvemos
    // el foco al buscador con el cursor al final
    if (state.searchFocus){
      var input = mount.querySelector('input[type="text"]');
      if (input){
        input.focus();
        var end = input.value.length;
        try { input.setSelectionRange(end, end); } catch (e) {}
      }
    }
  }

  rerender();
})();
</script>
